  const hd=`<div class="mhd"><div><h3 id="mTtl">Factura de proveedor</h3><p>${c?esc(cjNom(c))+' · '+esc(c.cajero):esc(QUIEN[S.rol])}</p></div><button data-close aria-label="Cerrar">✕</button></div>`;
  if(f.step==='ini')return hd+`<div class="field"><label for="fcProv">Proveedor</label><select id="fcProv" class="fcProv">${PROV.filter(p=>p.activo).map(p=>`<option value="${p.id}" ${p.id===f.prov?'selected':''}>${esc(p.n)}</option>`).join('')}</select></div>
    <div class="grid g2"><button class="btn" data-fcfoto>${ico('cam')}Sacar foto de la factura</button><button class="btn gh" data-fcmanual>${ico('list')}Cargar a mano, sin foto</button></div>
    <div class="note mt">La foto se guarda en la carpeta del local y el sistema la lee sola. Vas a ver <b>productos y cantidades</b>, sin precios, para controlar lo que llegó.</div>`;
  const prodSel=(i,v,extra)=>`<select class="fcSel" data-i="${i}" aria-label="Producto" style="border:1px solid var(--bs);border-radius:6px;padding:6px;background:var(--cp);color:var(--tp);max-width:100%">${extra||''}${PRODUCTOS.map(p=>`<option value="${p.id}" ${p.id===v?'selected':''}>${esc(p.n)} (${p.u})</option>`).join('')}</select>`;
  if(f.step==='items')return hd+(f.via==='Foto'?`<div class="cd" style="margin-bottom:10px;display:flex;gap:10px;align-items:center"><span class="pill ok">${ico('check')}Foto leída</span><span class="s">${esc(pv.n)} · factura ${esc(f.nro)} · ${f.rows.length} renglones</span></div>`
      :`<div class="note" style="margin-bottom:10px">Carga a mano de <b>${esc(pv.n)}</b>, sin comprobante. Los precios los toma del último que se pagó y el encargado los ajusta al aprobar.</div>`)+
    `<div class="seclbl" style="margin-top:0">${f.via==='Foto'?'Controlá lo que llegó':'Lo que llegó'}</div>
    <div class="cd">${f.rows.map((r,i)=>{const falta=r.fact!=null&&r.rec<r.fact,un=r.pid?P(r.pid).u:'';
      return `<div style="padding:9px 0;border-bottom:1px solid var(--bs)"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span style="flex:1;min-width:160px">${f.via==='Foto'&&r.pid&&!r.cambio?`<b>${esc(P(r.pid).n)}</b><span class="s" style="display:block">${esc(r.txt)}</span>`
          :f.via==='Foto'?`${prodSel(i,r.pid,`<option value="" ${r.pid?'':'selected'}>No sé: que lo resuelva el encargado</option>`)}<span class="s" style="display:block">${r.pid?'':'No lo reconoció: '}${esc(r.txt)}</span>`
          :prodSel(i,r.pid)}</span>
        ${f.via==='Foto'?`<span class="s">Factura: <b>${q(r.fact,1)}</b> ${un}</span>`:''}
        <span style="display:flex;align-items:center;gap:4px"><span class="s">Llegó</span><input class="qty fcRec" data-i="${i}" type="number" min="0" step="0.5" value="${r.rec}" aria-label="Cantidad que llegó" style="width:72px"><span class="s">${un}</span></span>
        ${f.via==='Manual'?`<button class="btn gh sm" data-fcdel="${i}" aria-label="Quitar">✕</button>`:''}</div>
        ${falta?`<div style="margin-top:6px"><span class="pill crit">${r.rec?'Vino de menos: faltan '+q(r.fact-r.rec,1)+' '+un:'No llegó'}</span> <span class="s">entra al stock y a la cuenta corriente solo lo que llegó</span></div>`:''}</div>`}).join('')||'<div class="empty">Agregá lo que llegó.</div>'}
      ${f.via==='Manual'?`<button class="btn gh sm" style="margin-top:8px" data-fcadd>${ico('plus')}Agregar producto</button>`:''}</div>
    <div class="cd mt"><label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer"><input type="checkbox" class="fcPg" ${f.pagado?'checked':''} style="margin-top:3px;width:18px;height:18px;flex-shrink:0">
      <span><b>Se le pagó en efectivo con plata de la caja</b><span class="s" style="display:block">Queda como gasto "Proveedor" del turno y baja la cuenta corriente del proveedor.</span></span></label>
      ${f.pagado?`<div class="field" style="margin:10px 0 0"><label for="fcPm">Monto que se pagó</label><input id="fcPm" class="fcPm" type="number" min="0" step="100" value="${f.pago}" placeholder="0" style="max-width:200px"></div>`:''}</div>
    <div class="mft"><button class="btn gh" data-fcback>Volver</button><button class="btn" data-fcrev>Revisar</button></div>`;
  /* revisión */
  const ok=f.rows.filter(r=>r.pid&&r.rec>0),nr=f.rows.filter(r=>!r.pid),fl=f.rows.filter(r=>r.fact!=null&&r.rec<r.fact);
  return hd+`<div class="cd">${ok.map(r=>`<div class="ln"><span class="nm"><b>${esc(P(r.pid).n)}</b><i>${r.fact!=null&&r.rec<r.fact?'facturado '+q(r.fact,1)+' · ':''}entra al stock</i></span><span class="am">${q(r.rec,1)} ${P(r.pid).u}</span></div>`).join('')}
      ${nr.map(r=>`<div class="ln"><span class="pill warn">Lo resuelve el encargado</span><span class="nm"><b>${esc(r.txt)}</b></span><span class="am">${q(r.rec,1)}</span></div>`).join('')}
      ${f.pagado&&+f.pago?`<div class="ln" style="border-top:2px solid var(--bs)"><span class="nm"><b>Pagado en efectivo</b><i>sale de la caja del turno</i></span><span class="am">${money(+f.pago)}</span></div>`:''}</div>
    ${fl.length?`<div class="note mt" style="border-left-color:var(--crit)"><b>${fl.length} producto${fl.length>1?'s':''} vino de menos.</b> Queda el aviso para reclamarle al proveedor.</div>`:''}
    <div class="note mt" style="border-left-color:var(--warn)"><b>Una vez confirmada no la podés cambiar.</b> Sube el stock y suma a la cuenta corriente ahora, y queda esperando que la apruebe el encargado o el administrador. Si la rechazan, se borra.</div>
    <div class="mft"><button class="btn gh" data-fcitems>Volver a corregir</button><button class="btn ok" data-fcok>${ico('check')}Confirmar factura</button></div>`;}
/* lista de la caja: solo las del turno abierto */
function fcTurno(c){const ls=CARGAS.filter(x=>x.caja===c.id);
  return `<div class="seclbl" style="display:flex;align-items:center;gap:8px">Facturas de proveedores <button class="btn sm" style="margin-left:auto" data-fcnew>${ico('cam')}Cargar factura</button></div>
    <div class="cd">${ls.map(x=>`<div class="ln"><span class="nm"><b>${esc(PV(x.prov).n)}</b><i>${x.hora||''} · ${x.via==='Foto'?'factura '+esc(x.nro):'a mano, sin comprobante'} · ${x.it.length} producto${x.it.length===1?'':'s'}${x.pago?' · pagada en efectivo '+money(x.pago):''}</i><span style="display:flex;gap:6px;flex-wrap:wrap;margin-top:5px">${(x.falt||[]).length?`<span class="pill crit">Vino de menos</span>`:''}${fcPill(x)}</span></span></div>`).join('')||'<div class="empty">Todavía no cargaste facturas en este turno.</div>'}</div>`;}
const fcPill=x=>x.estado==='pendiente'?'<span class="pill warn">Espera aprobación</span>':x.estado==='rechazada'?'<span class="pill crit">Rechazada</span>':'<span class="pill ok">Aprobada</span>';
/* encargado y administrador: revisión y aprobación */
function mdlFcDet(id){const x=CARGAS.find(c=>c.id===id),ad=S.rol!=='cajero',pend=x.estado==='pendiente',cj=CAJAS.find(c=>c.id===x.caja);
  return `<div class="mhd"><div><h3 id="mTtl">${esc(PV(x.prov).n)} ${fcPill(x)}</h3><p>${x.via==='Foto'?'Factura '+esc(x.nro):'Carga a mano'} · cargó ${esc(x.by)}${cj?' en la caja, '+esc(cjNom(cj)):''}${x.aprob?' · aprobó '+esc(x.aprob):''}</p></div><button data-close aria-label="Cerrar">✕</button></div>
  <div class="cd">${x.it.map(([p,qq,pr],i)=>`<div class="ln"><span class="nm"><b>${esc(P(p).n)}</b><i>llegó ${q(qq,1)} ${P(p).u}${x.via==='Manual'?' · último precio':''}</i></span>
      ${ad&&pend?`<input class="qty fcPr" data-i="${i}" type="number" min="0" step="10" value="${pr}" aria-label="Precio de ${esc(P(p).n)}" style="width:92px">`:`<span class="s">${money2(pr)}</span>`}<span class="am" style="min-width:90px">${money(qq*pr)}</span></div>`).join('')}
    ${(x.sinRec||[]).map((r,i)=>`<div class="ln"><span class="pill warn">No reconocido</span><span class="nm"><b>${esc(r.txt)}</b><i>${q(r.qty,1)} · ${ad&&pend?'elegí el producto para que entre':'lo resuelve el encargado'}</i></span>
      ${ad&&pend?`<select class="fcRes" data-i="${i}" aria-label="Producto" style="border:1px solid var(--bs);border-radius:6px;padding:6px;background:var(--cp);color:var(--tp);max-width:180px"><option value="">Dejar afuera</option>${PRODUCTOS.map(p=>`<option value="${p.id}">${esc(p.n)}</option>`).join('')}</select>`:''}</div>`).join('')}
    <div class="ln" style="border-top:2px solid var(--bs)"><span class="nm"><b>Total que suma a la cuenta corriente</b><i>solo lo que llegó</i></span><span class="am">${money(totCarga(x))}</span></div>
    ${x.pago?`<div class="ln"><span class="nm"><b>Pagado en efectivo desde la caja</b><i>ya bajó la cuenta corriente</i></span><span class="am">− ${money(x.pago)}</span></div>`:''}</div>
  ${(x.falt||[]).length?`<div class="cd mt" style="border-color:var(--crit)"><h3>Para reclamar</h3>${x.falt.map(r=>`<div class="ln"><span class="nm"><b>${esc(P(r.pid).n)}</b><i>facturado ${q(r.fact,1)} · llegó ${q(r.rec,1)}</i></span><span class="pill crit">Faltan ${q(r.fact-r.rec,1)} ${P(r.pid).u}</span></div>`).join('')}</div>`:''}
  <div class="mft"><button class="btn gh" data-close>Cerrar</button>${ad&&pend?`<button class="btn gh" data-fcrech="${id}">Rechazar</button><button class="btn" data-fcaprob="${id}">${ico('check')}Aprobar</button>`:''}</div>`;}
function fcPendHtml(){const ls=CARGAS.filter(x=>x.estado==='pendiente');if(!ls.length||S.rol==='cajero')return '';
  return `<div class="cd" style="border-color:var(--warn);margin-bottom:12px"><h3>Facturas que cargó la caja</h3><div class="cds">Ya subieron el stock y la cuenta corriente. Revisá precios y lo que no reconoció.</div>
   ${ls.map(x=>`<div class="ln"><span class="pill info">Factura</span><span class="nm"><b>${esc(PV(x.prov).n)} · ${money(totCarga(x))}</b><i>${esc(x.by)} · ${x.hora||x.f}${(x.falt||[]).length?' · <span style="color:var(--crit)">vino de menos</span>':''}${(x.sinRec||[]).length?' · '+x.sinRec.length+' sin reconocer':''}</i></span>
     <button class="btn gh sm" data-fcver="${x.id}">Revisar</button><button class="btn sm" data-fcaprob="${x.id}">Aprobar</button></div>`).join('')}</div>`;}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-fcnew],[data-fcfoto],[data-fcmanual],[data-fcadd],[data-fcdel],[data-fcback],[data-fcrev],[data-fcitems],[data-fcok],[data-fcver],[data-fcaprob],[data-fcrech]');if(!t)return;
  const d=t.dataset,f=S.fc,m=$('#mdl');
  if(t.hasAttribute('data-fcnew')){fcNuevo();openMdl(mdlFc());return}
  if(t.hasAttribute('data-fcfoto')){const o=DEMO_OCR[f.prov]||{nro:'0001-000'+String(Date.now()).slice(-5),it:PRODUCTOS.filter(p=>p.prov===f.prov).slice(0,3).map(p=>[p.n.toUpperCase(),p.id,10])};
    Object.assign(f,{step:'items',via:'Foto',nro:o.nro,rows:o.it.map(([txt,pid,qq])=>fcRow(txt,pid,qq))});openMdl(mdlFc());return}
  if(t.hasAttribute('data-fcmanual')){const p0=PRODUCTOS.find(p=>p.prov===f.prov)||PRODUCTOS[0];Object.assign(f,{step:'items',via:'Manual',nro:null,rows:[{txt:'',pid:p0.id,fact:null,rec:1}]});openMdl(mdlFc());return}
  if(t.hasAttribute('data-fcadd')){f.rows.push({txt:'',pid:PRODUCTOS[0].id,fact:null,rec:1});openMdl(mdlFc());return}
  if(d.fcdel){f.rows.splice(+d.fcdel,1);openMdl(mdlFc());return}
  if(t.hasAttribute('data-fcback')){f.step='ini';openMdl(mdlFc());return}
  if(t.hasAttribute('data-fcitems')){f.step='items';openMdl(mdlFc());return}
  if(t.hasAttribute('data-fcrev')){if(!f.rows.some(r=>r.rec>0)){toast('Cargá al menos un producto que haya llegado.');return}
    if(f.pagado&&!(+f.pago)){toast('Poné cuánto se le pagó en efectivo.');return}
    f.step='rev';openMdl(mdlFc());return}
  if(t.hasAttribute('data-fcok')){const c=CA(),pv=PV(f.prov),hora=hhmm();
    const it=f.rows.filter(r=>r.pid&&r.rec>0).map(r=>[r.pid,r.rec,P(r.pid).precio]);
    const x={id:'cg'+Date.now(),f:'12/09',prov:f.prov,nro:f.nro,via:f.via,by:yo(),caja:c?c.id:null,hora,estado:'pendiente',it,
      falt:f.rows.filter(r=>r.pid&&r.fact!=null&&r.rec<r.fact).map(r=>({pid:r.pid,fact:r.fact,rec:r.rec})),
      sinRec:f.rows.filter(r=>!r.pid&&r.rec>0).map(r=>({txt:r.txt,qty:r.rec})),pago:f.pagado?+f.pago||0:0};
    CARGAS.unshift(x);it.forEach(([p,qq])=>P(p).stock+=qq);pv.saldo+=totCarga(x)-x.pago;Object.assign(pv,{estado:'done',quien:yo(),hora});
    if(x.pago&&c)c.g.push({h:hora,cat:'Proveedor',det:pv.n+(x.nro?' — factura '+x.nro:' — sin comprobante'),medio:'Efectivo',monto:x.pago,by:yo()});
    S.fc=null;closeMdl();render(true);toast(`Factura de ${pv.n} cargada: subió el stock y espera aprobación.${x.falt.length?' Queda el aviso de lo que vino de menos.':''}`);return}
  if(d.fcver){openMdl(mdlFcDet(d.fcver));return}
  if(d.fcaprob){const x=CARGAS.find(c=>c.id===d.fcaprob),pv=PV(x.prov),abierto=m.querySelector('.fcPr')&&!$('#mbg').hidden;
    if(abierto){m.querySelectorAll('.fcPr').forEach(i=>{const k=+i.dataset.i,n=+i.value||0,it=x.it[k];if(n!==it[2]){pv.saldo+=(n-it[2])*it[1];
        audit('Modificó',`Factura · ${pv.n} · ${P(it[0]).n}`,money2(it[2])+' / '+P(it[0]).u,money2(n)+' / '+P(it[0]).u);it[2]=n;P(it[0]).precio=n;}});
      m.querySelectorAll('.fcRes').forEach(s=>{const r=x.sinRec[+s.dataset.i];if(s.value){x.it.push([s.value,r.qty,P(s.value).precio]);P(s.value).stock+=r.qty;pv.saldo+=r.qty*P(s.value).precio;r.ok=true;}});
      x.sinRec=(x.sinRec||[]).filter(r=>!r.ok);}
    x.estado='aprobada';x.aprob=yo();audit('Aprobó',`Factura · ${pv.n} (${x.by}, ${x.f})`,'',money(totCarga(x)));
    closeMdl();render(true);toast(`Factura de ${pv.n} aprobada.${(x.falt||[]).length?' Quedó el reclamo por lo que vino de menos.':''}`);return}
  if(d.fcrech){const x=CARGAS.find(c=>c.id===d.fcrech),pv=PV(x.prov);x.it.forEach(([p,qq])=>P(p).stock-=qq);pv.saldo-=totCarga(x)-(x.pago||0);
    CARGAS.splice(CARGAS.indexOf(x),1);audit('Rechazó',`Factura · ${pv.n} (${x.by}, ${x.f})`,money(totCarga(x)),'Borrada: el stock y la cuenta corriente vuelven atrás');
    closeMdl();render(true);toast(`Factura rechazada y borrada.${x.pago?' El pago en efectivo queda como gasto del turno.':''}`);return}
});
document.addEventListener('change',ev=>{const t=ev.target,c=t.classList,f=S.fc;if(!f)return;
  if(c.contains('fcProv'))f.prov=t.value;
  else if(c.contains('fcRec')){f.rows[+t.dataset.i].rec=+t.value||0;openMdl(mdlFc());}
  else if(c.contains('fcSel')){const r=f.rows[+t.dataset.i];r.pid=t.value||null;r.cambio=true;openMdl(mdlFc());}
  else if(c.contains('fcPg')){f.pagado=t.checked;openMdl(mdlFc());}
  else if(c.contains('fcPm'))f.pago=t.value;});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#mbg').hidden)closeMdl();else if(!$('#drw').hidden)closeDrw()});
/* menú lateral del celular */
function openDrw(){const d=$('#drw');d.hidden=false;document.body.style.overflow='hidden';
  (d.querySelector('.snav-btn.active')||d.querySelector('.drw-x')).focus();}
function closeDrw(){const d=$('#drw');if(d.hidden)return;d.hidden=true;document.body.style.overflow='';
  const m=$('#bnav [data-more]');if(m&&window.innerWidth<=900)m.focus();}
addEventListener('resize',()=>{if(window.innerWidth>900)closeDrw()});
$('#fab').addEventListener('click',()=>openMdl(MDL.carga(1)));
$('#localSel').addEventListener('change',e=>{const l=LC(e.target.value);
  if(!l.piloto){toast('Ese local todavía no está dado de alta: se abre clonando la plantilla del piloto.');e.target.value=S.local;return}
  S.local=l.id;render();});
$('#themeBtn').addEventListener('click',()=>{const c=document.documentElement.getAttribute('data-theme');
  const d=c?c==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.setAttribute('data-theme',d?'light':'dark');});
addEventListener('resize',()=>{$('#fab').style.display=window.innerWidth<=900&&S.rol!=='cajero'&&!['empleados','caja','produccion','desperdicio'].includes(S.scr)?'grid':'none'});

/* ---------- init ---------- */
$('#localSel').innerHTML=LOCALES.map(l=>`<option value="${l.id}">${esc(l.n)}${l.piloto?'':' · pendiente'}</option>`).join('');
$('#localSel').value=S.local;
renderRoles();render();
</script>
