<!doctype html>
<html lang="es">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Estación · Sistema Unificado</title>
<style>
:root{
  --cp:#ffffff; --cs:#f8fafc; --tp:#1e293b; --ts:#64748b; --bs:#e2e8f0; --bt:#f1f5f9;
  --navy:#0f3460; --navy-2:#1b4b86; --navy-ink:#93c5fd; --navy-soft:#e8eef7;
  --ok:#16a34a; --ok-bg:#dcfce7; --warn:#d97706; --warn-bg:#fef3c7;
  --crit:#dc2626; --crit-bg:#fee2e2; --info:#0284c7; --info-bg:#e0f2fe;
  --rl:12px; --rm:8px; --sidebar:240px; --on-navy:#ffffff;
  --f:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --fm:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --cp:#151d28; --cs:#0c121a; --tp:#e8eef6; --ts:#94a3b8; --bs:#27313f; --bt:#1b2431;
  --navy:#5b95d9; --navy-2:#8fbbe9; --navy-ink:#bcd8f5; --navy-soft:#18273a;
  --ok:#4ade80; --ok-bg:#10291c; --warn:#fbbf24; --warn-bg:#2b2210;
  --crit:#f87171; --crit-bg:#2c1515; --info:#38bdf8; --info-bg:#0c2434; --on-navy:#0c121a;
}}
:root[data-theme="dark"]{
  --cp:#151d28; --cs:#0c121a; --tp:#e8eef6; --ts:#94a3b8; --bs:#27313f; --bt:#1b2431;
  --navy:#5b95d9; --navy-2:#8fbbe9; --navy-ink:#bcd8f5; --navy-soft:#18273a;
  --ok:#4ade80; --ok-bg:#10291c; --warn:#fbbf24; --warn-bg:#2b2210;
  --crit:#f87171; --crit-bg:#2c1515; --info:#38bdf8; --info-bg:#0c2434; --on-navy:#0c121a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--cs);color:var(--tp);font-family:var(--f);font-size:14px;line-height:1.45}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:4px}
.n{font-variant-numeric:tabular-nums}

/* ===== topbar demo ===== */
.demobar{position:sticky;top:0;z-index:60;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.12)}
:root[data-theme="dark"] .demobar,:root:not([data-theme="light"]) .demobar{background:#0d1622}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .demobar{background:#0f3460}}
.demobar b{font-size:13px}
.demobar .tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:rgba(255,255,255,.16);padding:2px 7px;border-radius:20px;font-weight:700}
.demobar select{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:var(--rm);padding:5px 8px;font-size:12px}
.demobar select option{color:#1e293b;background:#fff}
.rsw{display:flex;gap:2px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:var(--rm);padding:2px;margin-left:auto}
.rsw button{background:none;border:0;color:#cfe0f5;padding:5px 11px;border-radius:6px;font-size:12px;font-weight:600}
.rsw button[aria-pressed="true"]{background:#fff;color:#0f3460}
.tbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:var(--rm);width:30px;height:30px;display:grid;place-items:center}

/* ===== shell ===== */
.wrap{display:flex;min-height:calc(100vh - 46px)}
.sidebar{width:var(--sidebar);background:var(--navy);flex-shrink:0;display:flex;flex-direction:column;padding:14px 10px;position:sticky;top:46px;height:calc(100vh - 46px);overflow:auto}
:root[data-theme="dark"] .sidebar,:root:not([data-theme="light"]) .sidebar,:root[data-theme="dark"] .drw,:root:not([data-theme="light"]) .drw{background:#0d1622;border-right:1px solid var(--bs)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .sidebar,:root:not([data-theme="dark"]) .drw{background:#0f3460;border-right:0}}
.drw-bg{position:fixed;inset:0;z-index:85;background:rgba(15,23,42,.55)}
.drw-bg[hidden]{display:none!important}
.drw{position:absolute;top:0;bottom:0;left:0;width:min(300px,86vw);background:#0f3460;display:flex;flex-direction:column;padding:14px 10px calc(14px + env(safe-area-inset-bottom));overflow-y:auto;box-shadow:8px 0 30px rgba(0,0,0,.3)}
.drw .snav-btn{font-size:14px;padding:11px 10px}
.drw-x{margin-left:auto;background:rgba(255,255,255,.12);border:0;color:#fff;width:32px;height:32px;border-radius:20px;font-size:16px;line-height:1;flex-shrink:0}
@media (prefers-reduced-motion:no-preference){.drw-bg:not([hidden]){animation:dfade .18s ease-out}.drw-bg:not([hidden]) .drw{animation:dIn .22s cubic-bezier(.2,.8,.2,1)}
@keyframes dfade{from{background:rgba(15,23,42,0)}}@keyframes dIn{from{transform:translateX(-100%)}}}
.sidebar-logo{padding:4px 8px 14px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px}
.sidebar-logo p{margin:6px 0 0;color:#fff;font-weight:700;font-size:15px}
.sidebar-logo small{color:#93c5fd;font-size:11px}
.snav-grp{color:#7fa9d8;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:12px 8px 4px}
.snav-btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--rm);border:0;background:none;color:#cfe0f5;font-size:13px;width:100%;text-align:left;line-height:1.2}
.snav-btn svg{width:17px;height:17px;flex-shrink:0;opacity:.9}
.snav-btn:hover{background:rgba(255,255,255,.09)}
.snav-btn.active{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
.snav-badge{background:var(--crit);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;margin-left:auto}
.sidebar-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding-top:8px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.hdr{background:var(--cp);border-bottom:1px solid var(--bs);padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hdr .sub{margin:0;color:var(--ts);font-size:12px}
.hdr .ttl{margin:1px 0 0;font-size:19px;font-weight:700}
.bd{padding:18px 20px 90px;max-width:1120px}
.bnav{display:none}
.fab{display:none}

@media (max-width:900px){
  .sidebar{display:none}
  .hdr{padding:12px 14px}
  .bd{padding:14px 14px 108px}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--cp);border-top:1.5px solid var(--bs);justify-content:space-around;padding:6px 0 calc(10px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px}
  .bnav button svg{width:21px;height:21px;color:var(--ts)}
  .bnav button span{font-size:10px;font-weight:500;color:var(--ts)}
  .bnav button.active svg,.bnav button.active span{color:var(--navy);font-weight:600}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:78px;width:54px;height:54px;border-radius:50%;background:#16a34a;border:0;box-shadow:0 6px 18px rgba(22,163,74,.45);z-index:55}
  .fab svg{width:26px;height:26px;color:#fff}
}

/* ===== piezas ===== */
.cd{background:var(--cp);border:1px solid var(--bs);border-radius:var(--rl);padding:14px}
.cd h3{font-size:14px;margin-bottom:2px}
.cd .cds{color:var(--ts);font-size:12px;margin-bottom:10px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(262px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.mt{margin-top:14px}
.stat{background:var(--cp);border:1px solid var(--bs);border-radius:var(--rl);padding:12px 13px}
.stat .l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ts);font-weight:700}
.stat .v{font-size:21px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .f{font-size:11.5px;color:var(--ts);margin-top:2px}
.stat.dark{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.stat.dark .l,.stat.dark .f{color:var(--on-navy);opacity:.8}
.stat.ok .v{color:var(--ok)}.stat.crit .v{color:var(--crit)}.stat.warn .v{color:var(--warn)}

.tabs{display:flex;gap:18px;overflow-x:auto;border-bottom:1px solid var(--bs);margin-bottom:14px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 0;color:var(--ts);font-size:13.5px;font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fchip{background:var(--cp);border:1px solid var(--bs);border-radius:20px;padding:5px 12px;font-size:12.5px;color:var(--ts);font-weight:500}
.fchip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy);font-weight:600}

.tw{overflow-x:auto;background:var(--cp);border:1px solid var(--bs);border-radius:var(--rl)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ts);font-weight:700;padding:9px 12px;background:var(--bt);border-bottom:1px solid var(--bs);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--bt);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.cl{cursor:pointer} tr.cl:hover{background:var(--bt)}
.r{text-align:right}.c{text-align:center}
td.r.n{white-space:nowrap}
.m{font-weight:600}.s{color:var(--ts);font-size:11.5px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2.5px 8px;border-radius:20px;white-space:nowrap}
.pill svg{width:12px;height:12px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.mute{background:var(--bt);color:var(--ts)}
.dot{width:6px;height:6px;border-radius:20px;background:currentColor}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--navy);color:var(--on-navy);border:1px solid var(--navy);border-radius:var(--rm);padding:9px 14px;font-size:13.5px;font-weight:600}
.btn svg{width:16px;height:16px}
.btn.gh{background:var(--cp);color:var(--tp);border-color:var(--bs)}
.btn.gh:hover{background:var(--bt)}
.btn.ok{background:#16a34a;border-color:#16a34a;color:#fff}
.btn.cr{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.full{width:100%}

.field{display:grid;gap:5px;margin-bottom:11px}
.field label{font-size:11.5px;font-weight:700;color:var(--ts)}
.field label .u{font-weight:400;text-transform:none}
.field input,.field select,.field textarea{background:var(--cp);border:1px solid var(--bs);border-radius:var(--rm);padding:9px 10px;font-size:14px;width:100%}
.field .hint{font-size:11.5px;color:var(--ts)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seclbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ts);font-weight:700;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.seclbl:first-child{margin-top:0}
.note{background:var(--bt);border-left:3px solid var(--navy);border-radius:0 var(--rm) var(--rm) 0;padding:10px 12px;font-size:12.5px;color:var(--ts)}
.note b{color:var(--tp)}
.empty{padding:26px;text-align:center;color:var(--ts);font-size:13px}
.lock{display:grid;justify-items:center;gap:6px;text-align:center;padding:34px 18px;background:var(--cp);border:1px dashed var(--bs);border-radius:var(--rl);color:var(--ts)}
.lock b{color:var(--tp);font-size:15px}
.lock svg{width:22px;height:22px;color:var(--ts)}

.ln{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bt)}
.ln:last-child{border-bottom:0}
.ln .nm{flex:1;min-width:0}
.ln .nm b{font-size:13px;font-weight:600;display:block}
.ln .nm i{font-style:normal;color:var(--ts);font-size:11.5px;display:block}
.ln .am{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;white-space:nowrap;text-align:right}
.qty{width:78px;text-align:right;background:var(--cp);border:1px solid var(--bs);border-radius:6px;padding:5px 7px;font-size:13px;font-variant-numeric:tabular-nums;flex-shrink:0}
.tree{padding-left:13px;border-left:2px solid var(--bt);margin:6px 0 0}
.bar{height:7px;border-radius:20px;background:var(--bt);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--navy);border-radius:20px}
.costbox{display:flex;align-items:center;gap:12px;background:var(--navy-soft);border:1px solid var(--bs);border-radius:var(--rl);padding:12px 14px;margin-top:12px}
.costbox .cl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ts);font-weight:700}
.costbox .per{font-size:12px;color:var(--ts);margin-top:2px}
.costbox .cv{margin-left:auto;font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--navy)}

.mbg{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:80;display:grid;place-items:end center}
.mbg[hidden]{display:none!important}
.mdl{background:var(--cp);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 24px}
@media(min-width:700px){.mbg{place-items:center}.mdl{border-radius:var(--rl);max-height:88vh;padding:18px}}
.mhd{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.mhd h3{font-size:17px}
.mhd p{margin:2px 0 0;color:var(--ts);font-size:12.5px}
.mhd button{margin-left:auto;background:var(--bt);border:0;border-radius:20px;width:28px;height:28px;color:var(--ts);font-size:15px;line-height:1;flex-shrink:0}
.mft{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--bs)}
.ac{width:30px;height:28px;border-radius:6px;border:1px solid var(--bs);background:var(--cp);font-size:11.5px;font-weight:700;display:grid;place-items:center;padding:0;margin:auto}
.ac.a-o{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.ac.a-F{background:var(--crit-bg);color:var(--crit);border-color:transparent}
.ac.a-d{color:var(--ts)}
.ac.a-X{background:var(--bt);color:var(--ts);border-style:dashed;cursor:default}
.asg td,.asg th{padding:7px 4px}.asg td:first-child,.asg th:first-child{padding-left:12px;min-width:120px}
.fchip:disabled{cursor:not-allowed}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--tp);color:var(--cs);padding:10px 16px;border-radius:20px;font-size:13px;font-weight:500;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.bd>div{animation:f .16s ease-out}@keyframes f{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>

function runEtapas(rid,st,factor,upTo){const spec=PRS[rid];let kg=0,cost=0;const out=[];
  const n=upTo!=null?upTo:(st?st.length:spec.etapas.length);
  for(let i=0;i<n;i++){const et=spec.etapas[i],real=st&&st[i];
    const adds=real?Object.entries(real.add||{}):et.add.map(([p,c])=>[p,c*factor]);
    let addKg=0,addCost=0;adds.forEach(([p,c])=>{addKg+=kgOf(p,c);addCost+=c*P(p).precio});
    const kgIn=kg+addKg,costIn=cost+addCost;let rows,despKg,redKg,sale;
    if(real){rows=(real.desp||[]).filter(d=>d.kg>0);despKg=rows.reduce((a,d)=>a+d.kg,0);sale=real.sale;
      const resid=Math.max(0,kgIn-despKg-sale);
      if(et.red!==undefined)redKg=resid;else{redKg=0;if(resid>.0005){rows=rows.concat([{kg:resid,tipo:'desc',auto:true}]);despKg+=resid}}}
    else{rows=et.desp.modo==='prod'?Object.entries(et.desp.items).map(([p,pc])=>{const a=adds.find(x=>x[0]===p);return {p,kg:a?kgOf(p,a[1])*pc:0,tipo:et.desp.tipo}})
        :[{kg:kgIn*et.desp.pct,tipo:et.desp.tipo}];
      despKg=rows.reduce((a,d)=>a+d.kg,0);redKg=et.red?(kgIn-despKg)*et.red:0;sale=kgIn-despKg-redKg;}
    out.push({et,i,adds,addKg,kgIn,costIn,rows,despKg,redKg,sale,
      despPct:kgIn?despKg/kgIn:0,redPct:(kgIn-despKg)>0?redKg/(kgIn-despKg):0,
      despCost:kgIn?costIn*despKg/kgIn:0,redCost:kgIn?costIn*redKg/kgIn:0});
    kg=sale;cost=costIn;}
  const complete=n===spec.etapas.length, last=st&&st[n-1];
  const units=spec.salida==='u'&&complete?(last&&last.units!=null?last.units:Math.floor(kg*1000/spec.grU)):null;
  const qty=spec.salida==='u'?units:kg;
  return {st:out,kgFinal:kg,cost,units,qty,unit:qty?cost/qty:0,complete,
    kgIn:out.reduce((a,s)=>a+s.addKg,0),perdDesp:out.reduce((a,s)=>a+s.despCost,0),perdRed:out.reduce((a,s)=>a+s.redCost,0)};}

      <button class="btn gh sm" style="margin-left:auto" data-pwexit>Dejar en proceso</button></div>
    <div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap">${spec.etapas.map((e,j)=>{const s=rec.st[j];
      return `<span class="pill ${j<i?'ok':j===i?'info':'mute'}" style="padding:5px 10px">${j<i?ico('check'):''}${j+1}. ${esc(e.n)}${s?` · ${esc(s.by)} ${s.hora} · salió ${kg3(s.sale)}`:''}</span>`}).join('')}</div></div>
  <div class="cd">
    <div class="seclbl" style="margin:0 0 4px">Etapa ${i+1} de ${spec.etapas.length} · ${esc(et.n)}</div>
    <div class="cds">${et.red!==undefined?'Pesá antes y después de cocinar. Lo que se evapora se calcula solo como reducción.':et.desp.modo==='prod'?'El desperdicio se pesa por producto.':'El desperdicio se pesa sobre toda la preparación.'}</div>
    ${i?`<div class="ln"><span class="nm"><b>Viene de ${esc(spec.etapas[i-1].n.toLowerCase())}</b><i>lo que salió de la etapa anterior</i></span><span class="am">${kg3(prev)}</span></div>`:''}
    ${et.add.length?`<div class="seclbl" style="margin:10px 0 2px">Lo que entra en esta etapa</div>${Object.entries(pw.add).map(([p,c])=>`<div class="ln"><span class="nm"><b>${esc(P(p).n)}</b><i>Stock ${q(P(p).stock,1)} ${P(p).u}${P(p).u==='u'?' · '+q(KGU[p]*1000,0)+' g c/u':''}</i></span>
      <input class="qty pwA" data-p="${p}" type="number" step="0.01" min="0" value="${c}" aria-label="Cantidad de ${esc(P(p).n)}"><span class="s" style="width:22px">${P(p).u}</span></div>`).join('')}`:''}
    <div class="ln" style="border-top:2px solid var(--bs)"><span class="nm"><b>Peso que entra</b><i>${et.red!==undefined?'peso antes de cocinar':'se calcula solo'}</i></span><span class="am" id="pwIn">—</span></div>
    <div class="seclbl" style="margin:12px 0 2px">Lo que se tira</div>
    ${pw.rows.map((r,k)=>`<div class="ln"><span class="nm"><b>${r.p?esc(P(r.p).n):'Desperdicio'}</b><i><select class="pwT" data-k="${k}" aria-label="Tipo de desperdicio" style="border:1px solid var(--bs);border-radius:6px;padding:3px 6px;background:var(--cp);font-size:12px">${TIPOS().filter(t=>t.id!=='red').map(t=>`<option value="${t.id}" ${t.id===r.tipo?'selected':''}>${esc(t.n)}</option>`).join('')}</select></i></span>
      <input class="qty pwD" data-k="${k}" type="number" step="0.01" min="0" value="${r.kg}" aria-label="Kilos tirados"><span class="s" style="width:22px">kg</span></div>`).join('')}
    <button class="btn gh sm" style="margin-top:6px" data-pwaddrow>${ico('plus')}Otro desperdicio</button>
    <div class="seclbl" style="margin:14px 0 2px">Lo que sale</div>
    <div class="ln"><span class="nm"><b>${et.red!==undefined?'Peso después de cocinar':'Peso que sale'}</b><i>${et.red!==undefined?'ya sin lo que se tiró':'lo que pasa a la etapa siguiente'}</i></span>
      <input class="qty pwS" type="number" step="0.01" min="0" value="${pw.sale}" aria-label="Peso que sale"><span class="s" style="width:22px">kg</span></div>
    ${ult&&spec.salida==='u'?`<div class="ln"><span class="nm"><b>Unidades que salen</b><i>${spec.grU} g cada una</i></span>
      <input class="qty pwU" type="number" step="1" min="0" value="${pw.units??''}" aria-label="Unidades"><span class="s" style="width:22px">u</span></div>`:''}
  </div>
  <div id="pwCmp" class="mt"></div>
  <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn gh" data-pwexit>Dejar en proceso</button>
    <button class="btn ok" style="margin-left:auto" data-pwrev>Revisar y confirmar ${ult?'y cerrar la producción':'la etapa'}</button></div>`;
}
function pwCalc(){const rec=PRODS.find(p=>p.id===S.prodAct),i=rec.st.length,pw=S.pw;
  const st=rec.st.concat([{add:pw.add,desp:pw.rows.map(r=>({p:r.p,kg:+r.kg||0,tipo:r.tipo})),sale:+pw.sale||0,units:pw.units}]);
  return {rec,i,c:runEtapas(rec.rec,st,rec.factor,i+1),e:prEst(rec.rec,rec.factor)};}
function pwRefresh(){const box=$('#pwCmp');if(!box)return;const {rec,i,c,e}=pwCalc(),s=c.st[i],es=e.st[i],m=PRS[rec.rec].margen/100,spec=PRS[rec.rec];
  $('#pwIn').textContent=kg3(s.kgIn);
  const overD=s.despPct-es.despPct>m, overR=s.et.red!==undefined&&s.redPct-es.redPct>m, cuadra=s.et.red===undefined&&s.rows.some(r=>r.auto);
  const ult=i===spec.etapas.length-1;
  box.innerHTML=`<div class="grid g3">
    ${stat('Desperdicio de la etapa',pctS(s.despPct),`${kg3(s.despKg)} · estimado ${pctS(es.despPct)}`,overD?'crit':'ok')}
    ${s.et.red!==undefined?stat('Reducción por cocción',pctS(s.redPct),`${kg3(s.redKg)} · estimado ${pctS(es.redPct)}`,overR?'crit':'ok')
      :stat('Sale de la etapa',kg3(s.sale),`estimado ${kg3(es.sale)}`)}
    ${verCostos()?stat(ult?'Costo por '+salU(rec.rec):'Costo acumulado',ult&&c.qty?money2(c.unit):money(c.cost),ult?`receta ${money2(prEst(rec.rec).unit)}`:`pérdida de la etapa ${money(s.despCost+s.redCost)}`,'dark')
      :stat(ult&&spec.salida==='u'?'Unidades':'Sale',ult&&spec.salida==='u'?q0(c.units||0)+' u':kg3(s.sale),'estimado '+(ult&&spec.salida==='u'?q0(e.units)+' u':kg3(es.sale)),'dark')}</div>
  ${overD||overR?`<div class="cd mt" style="border-color:var(--crit);background:var(--crit-bg)"><b>Se pasa del margen de la receta (${spec.margen} puntos).</b>
    <div class="s" style="color:var(--tp)">${overD?`El desperdicio da ${pctS(s.despPct)} y lo estimado es ${pctS(es.despPct)}. `:''}${overR?`La reducción da ${pctS(s.redPct)} y lo estimado es ${pctS(es.redPct)}.`:''} Revisá los pesos; si están bien, se confirma igual y queda marcado.</div></div>`:''}
  ${s.sale+s.despKg>s.kgIn*1.01?`<div class="note mt" style="border-left-color:var(--crit)"><b>Sale más de lo que entra:</b> entre lo tirado (${kg3(s.despKg)}) y lo que sale (${kg3(s.sale)}) hay ${kg3(s.sale+s.despKg-s.kgIn)} de más. Revisá la balanza o lo que entró.</div>`:''}
  ${cuadra?`<div class="note mt" style="border-left-color:var(--warn)">El peso no cierra: faltan ${kg3(s.rows.find(r=>r.auto).kg)} entre lo que entró, lo que se tiró y lo que sale. Se va a sumar como descarte.</div>`:''}`;}
function mdlPwRev(){const {rec,i,c}=pwCalc(),s=c.st[i],spec=PRS[rec.rec],ult=i===spec.etapas.length-1,caj=S.rol==='cajero';
  return `<div class="mhd"><div><h3 id="mTtl">Revisá antes de confirmar</h3><p>${esc(R(rec.rec).n)} · etapa ${i+1}: ${esc(s.et.n)}</p></div><button data-close aria-label="Cerrar">✕</button></div>

    <div class="ln"><span class="nm"><b>Peso que entra</b></span><span class="am">${kg3(s.kgIn)}</span></div>
    ${s.rows.map(r=>`<div class="ln"><span class="pill crit">${esc(TN(r.tipo))}</span><span class="nm"><b>${r.p?esc(P(r.p).n):r.auto?'Diferencia de peso':'Desperdicio'}</b></span><span class="am">${kg3(r.kg)}</span></div>`).join('')}
    ${s.redKg>0?`<div class="ln"><span class="pill warn">Reducción</span><span class="nm"><b>Se evaporó al cocinar</b></span><span class="am">${kg3(s.redKg)}</span></div>`:''}
    <div class="ln" style="border-top:2px solid var(--bs)"><span class="nm"><b>Sale</b></span><span class="am">${kg3(s.sale)}${ult&&spec.salida==='u'?' · '+q0(c.units||0)+' u':''}</span></div></div>
  ${caj?`<div class="note mt" style="border-left-color:var(--warn)"><b>Una vez que confirmes no lo vas a poder cambiar.</b> ${ult?'La producción queda esperando que la apruebe el encargado o el administrador. El stock se mueve ahora; si la rechazan, se borra.':'Revisá bien los pesos.'}</div>`
    :`<div class="note mt">${ult?'Al confirmar se cierra la producción: baja la mercadería y entra lo elaborado al stock.':'Al confirmar queda guardada la etapa. La siguiente la puede cargar otra persona.'}</div>`}
  <div class="mft"><button class="btn gh" data-close>Volver a corregir</button><button class="btn ok" data-pwok>${ico('check')}Confirmar ${ult?'y cerrar':'etapa'}</button></div>`;}
/* ---- detalle de una producción ---- */
function mdlProd(id){const p=PRODS.find(x=>x.id===id),spec=PRS[p.rec],c=runEtapas(p.rec,p.st,p.factor),e=prEst(p.rec,p.factor),al=alertas(p),ad=S.rol!=='cajero',ed=S.editProd===id;

    ${verCostos()?stat('Costo real por '+salU(p.rec),c.complete?money2(c.unit):'—',`receta ${money2(prEst(p.rec).unit)}`,c.unit>prEst(p.rec).unit*1.03?'warn':'ok'):stat('Etapas',c.st.length+' de '+spec.etapas.length,'cargadas')}
    ${verCostos()?stat('Pérdida incluida',money(c.perdDesp+c.perdRed),`desperdicio ${money(c.perdDesp)} · reducción ${money(c.perdRed)}`,al.length?'crit':''):stat('Desperdicio',kg3(c.st.reduce((a,s)=>a+s.despKg,0)),al.length?al.length+' aviso(s)':'dentro del margen',al.length?'crit':'ok')}</div>

  ${c.st.map((s,i)=>{const es=e.st[i],raw=p.st[i];return `<div class="cd" style="margin-bottom:10px"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><h3>${i+1}. ${esc(s.et.n)}</h3><span class="s">${esc(raw.by)} · ${raw.hora}</span></div>
    ${s.adds.length?`<div class="s" style="margin-bottom:4px">Entra: ${s.adds.map(([pp,cc])=>`${esc(P(pp).n)} ${q(cc,2)} ${P(pp).u}`).join(' · ')}</div>`:''}
    <div class="ln"><span class="nm"><b>Peso que entra</b></span><span class="am">${kg3(s.kgIn)}</span></div>
    ${s.rows.map((r,k)=>`<div class="ln"><span class="pill crit">${esc(TN(r.tipo))}</span><span class="nm"><b>${r.p?esc(P(r.p).n):r.auto?'Diferencia de peso':'Desperdicio'}</b><i>${pctS(s.kgIn?r.kg/s.kgIn:0)} de lo que entró${verCostos()?' · '+money(s.kgIn?s.costIn*r.kg/s.kgIn:0):''}</i></span>
      ${ed&&!r.auto?`<input class="qty peD" data-i="${i}" data-k="${k}" type="number" step="0.01" value="${r.kg}" aria-label="Kilos">`:`<span class="am">${kg3(r.kg)}</span>`}</div>`).join('')}
    ${s.et.red!==undefined?`<div class="ln"><span class="pill warn">Reducción</span><span class="nm"><b>Se evaporó al cocinar</b><i>${pctS(s.redPct)} · estimado ${pctS(es.redPct)}${verCostos()?' · '+money(s.redCost):''}</i></span><span class="am">${kg3(s.redKg)}</span></div>`:''}
    <div class="ln" style="border-top:2px solid var(--bs)"><span class="nm"><b>Sale</b><i>desperdicio ${pctS(s.despPct)} · estimado ${pctS(es.despPct)}</i></span>
      ${ed?`<input class="qty peS" data-i="${i}" type="number" step="0.01" value="${raw.sale}" aria-label="Peso que sale">`:`<span class="am">${kg3(s.sale)}${i===c.st.length-1&&c.units!=null?' · '+q0(c.units)+' u':''}</span>`}</div></div>`}).join('')}
  <div class="mft"><button class="btn gh" data-close>Cerrar</button>
    ${p.estado==='proceso'?`<button class="btn" data-prodopen="${p.id}">Seguir con la próxima etapa</button>`:''}
    ${ad&&p.estado==='pendiente'?`<button class="btn gh" data-rech="prod:${p.id}">Rechazar</button><button class="btn" data-aprob="prod:${p.id}">Aprobar</button>`:''}

function mdlNewProd(){return `<div class="mhd"><div><h3 id="mTtl">Nueva producción</h3><p>${esc(LC(S.local).n)} · ${esc(QUIEN[S.rol])}</p></div><button data-close aria-label="Cerrar">✕</button></div>
  <div class="field"><label for="npR">Qué se produce</label><select id="npR">${Object.keys(PRS).map(k=>`<option value="${k}">${esc(R(k).n)} · ${PRS[k].etapas.map(e=>e.n).join(' → ')}</option>`).join('')}</select></div>

/* ---------- BAJAS POR DESPERDICIO ---------- */
const bajaN=b=>b.t==='i'?P(b.id2).n:R(b.id2).n;
const bajaU=b=>b.t==='i'?P(b.id2).u:salU(b.id2);
const bajaKg=b=>b.t==='i'?kgOf(b.id2,b.qty):(PRS[b.id2]&&PRS[b.id2].salida==='u'?b.qty*PRS[b.id2].grU/1000:b.qty);
const bajaCost=b=>b.qty*(b.t==='i'?P(b.id2).precio:costoUn(b.id2));
function mdlBajaDesp(){const bd=S.bd,caj=S.rol==='cajero';
  if(bd.rev){const b=bd.data;return `<div class="mhd"><div><h3 id="mTtl">Revisá la baja</h3><p>${esc(QUIEN[S.rol])}</p></div><button data-close aria-label="Cerrar">✕</button></div>
    <div class="cd"><div class="ln"><span class="nm"><b>${esc(bajaN(b))}</b><i>${esc(TN(b.tipo))} · ${esc(b.motivo||'sin motivo')}</i></span><span class="am">${q(b.qty,2)} ${bajaU(b)}</span></div></div>
    <div class="note mt" ${caj?'style="border-left-color:var(--warn)"':''}>${caj?'<b>Una vez confirmada no la podés cambiar.</b> Sale del stock ahora y queda esperando que la apruebe el encargado o el administrador. Si la rechazan, vuelve al stock.':'Sale del stock y suma al reporte de desperdicio.'}</div>

function mdlBajaEdit(id){const b=BAJAS.find(x=>x.id===id);return `<div class="mhd"><div><h3 id="mTtl">Modificar baja</h3><p>${esc(bajaN(b))} · cargó ${esc(b.by)} el ${dm(b.f)}</p></div><button data-close aria-label="Cerrar">✕</button></div>

/* ---------- DESPERDICIO: reporte por período ---------- */
function despRows(){const o=[];
  PRODS.filter(p=>p.estado==='cerrada'||p.estado==='pendiente').forEach(p=>{const c=runEtapas(p.rec,p.st,p.factor);
    c.st.forEach((s,i)=>{const by=p.st[i].by;
      s.rows.forEach(r=>o.push({f:p.f,rec:p.rec,et:s.et.n,tipo:r.tipo,prod:r.p?P(r.p).n:'Mezcla de '+R(p.rec).n.toLowerCase(),kg:r.kg,cost:s.kgIn?s.costIn*r.kg/s.kgIn:0,by,pid:p.id}));
      if(s.redKg>0)o.push({f:p.f,rec:p.rec,et:s.et.n,tipo:'red',prod:'Evaporación de '+R(p.rec).n.toLowerCase(),kg:s.redKg,cost:s.redCost,by,pid:p.id});});});
  BAJAS.filter(b=>b.estado==='aprobada'||b.estado==='pendiente').forEach(b=>o.push({f:b.f,rec:b.t==='e'?b.id2:null,et:'Stock',tipo:b.tipo,prod:bajaN(b),kg:bajaKg(b),cost:bajaCost(b),by:b.by,baja:true}));
  return o;}
function scDesperdicio(){
  const l=[{id:'rep',n:'Reporte'},{id:'bajas',n:'Bajas desde stock'},{id:'tipos',n:'Tipos de desperdicio'}];
  const t=tabNow('desp',l);
  if(t==='bajas')return tabsBar('desp',l)+`<div style="display:flex;margin-bottom:12px"><button class="btn" style="margin-left:auto" data-mdl="bajadesp">${ico('plus')}Dar de baja por desperdicio</button></div>`+bajasTabla()+
    `<div class="note mt">Lo que carga la caja sale del stock en el momento y espera aprobación. Si se rechaza, vuelve al stock. Lo eliminado queda tachado y en el registro de cambios.</div>`;

    <div class="cd"><h3>Producciones que se pasaron del margen</h3><div class="cds">Tocá una para ver el detalle</div>
      ${conAl.length?conAl.sort((a,b)=>a.f<b.f?1:-1).map(p=>`<div class="ln cl" data-prodver="${p.id}"><span class="pill crit">${ico('alert')}</span><span class="nm"><b>${esc(R(p.rec).n)} · ${dm(p.f)}</b><i>${esc(alertas(p)[0])}</i></span><span class="s">${esc(p.by)}</span></div>`).join(''):'<div class="empty">Ninguna en este período.</div>'}</div></div>

function cajaCalc(c){const gEf=c.g.filter(g=>g.medio==='Efectivo').reduce((a,g)=>a+g.monto,0);
  if(!c.esp||!c.real){const gE=c.g.filter(g=>g.medio==='Efectivo'&&esEmp(g)).reduce((a,g)=>a+g.monto,0);return {gEf,gEmp:gE,gSolo:gEf-gE,espEf:0,tE:0,tR:c.conteo||0,dif:0,sin:true}}
  const gEmp=c.g.filter(g=>g.medio==='Efectivo'&&esEmp(g)).reduce((a,g)=>a+g.monto,0);
  const espEf=c.esp.efectivo-gEf, tE=Object.values(c.esp).reduce((a,b)=>a+b,0)-gEf, tR=Object.values(c.real).reduce((a,b)=>a+b,0);
  return {gEf,gEmp,gSolo:gEf-gEmp,espEf,tE,tR,dif:tR-tE};}

/* ---------- EMPLEADOS ---------- */
const LCN=l=>LC(l).n;
const yo=()=>QUIEN[S.rol].split(' · ')[0];
const r100e=n=>Math.round(n/100)*100;
const montoPer=(mens,met)=>r100e(mens/MET[met].f);
/* asignación de un empleado en un local: puesto, sueldo mensual, método y monto por período */
function ASG(e,loc=S.local){const a=e.asig[loc];if(!a)return null;const pu=PU(a.pid),mens=a.propio??pu.base;
  return Object.assign({},a,{loc,pu,mens,puesto:pu.n,mp:montoPer(mens,a.met)})}
const locsDe=e=>Object.keys(e.asig);
const enLocal=(loc=S.local)=>EMP.filter(e=>e.asig[loc]&&e.asig[loc].estado!=='baja');
const deBaja=(loc=S.local)=>EMP.filter(e=>e.asig[loc]&&e.asig[loc].estado==='baja');
const estPill=a=>a.estado==='prueba'?'<span class="pill info">A prueba</span>':a.estado==='baja'?'<span class="pill mute">De baja</span>':'';
const metTxt=a=>`${MET[a.met].n} · ${money(a.mp)}`;
/* ---- calendario de pagos ---- */
const dIso=(m,d)=>`2026-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const finMes=m=>new Date(2026,m,0).getDate();
const diasEntre=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5)+1;
const sumaDia=(iso,n)=>{const d=new Date(iso+'T12:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
function perBase(met,m){const F=finMes(m);
  if(met==='mes')return [[1,F]];if(met==='quincena')return [[1,15],[16,F]];if(met==='semana')return [[1,7],[8,14],[15,21],[22,F]];
  const o=[];for(let d=1;d<=F;d++)if(new Date(dIso(m,d)+'T12:00').getDay()!==0)o.push([d,d]);return o;}
/* períodos de un mes para un método, con el monto de cada uno; recorta por alta y prorratea si arranca a mitad */
function perMet(met,mens,m,desde,hasta){const amt=montoPer(mens,met);
  return perBase(met,m).map(([a,b])=>({ini:dIso(m,a),fin:dIso(m,b),met,amt,len:b-a+1})).filter(p=>p.fin>=desde&&p.ini<=hasta)
    .map(p=>{const ini=p.ini<desde?desde:p.ini,fin=p.fin>hasta?hasta:p.fin,d=diasEntre(ini,fin);
      return Object.assign(p,{ini,fin,amt:d<p.len?r100e(p.amt*d/p.len):p.amt,parcial:d<p.len})});}
function periodos(a,mk){const m=+MESES[mk].k,ini=a.alta>MESES[mk].ini?a.alta:MESES[mk].ini,fin=MESES[mk].fin;
  if(ini>fin)return [];
  const c=a.cambio;
  if(c&&c.desde<=fin)return perMet(a.met,a.mens,m,ini,sumaDia(c.desde,-1)).concat(perMet(c.met,a.mens,m,c.desde>ini?c.desde:ini,fin));
  return perMet(a.met,a.mens,m,ini,fin);}
/* el cambio de método rige cuando termina el período en curso */
function proxInicio(met,iso){const d=+iso.slice(8,10),m=+iso.slice(5,7),F=finMes(m);
  const fins=met==='dia'?[d]:met==='semana'?[7,14,21,F]:met==='quincena'?[15,F]:[F];
  return sumaDia(dIso(m,fins.find(x=>x>=d)),1);}
/* ---- cierre y estado de pagos de un empleado en un local ---- */
function asisMes(e,mk,loc){
  if(mk==='ago'){const a=(ASIS_AGO[e.id]||{})[loc]||{};return {faltas:a.faltas||0,dias:0}}
  const s=(S.asis[e.id]||{})[loc]||'------------';return {dias:(s.match(/o/g)||[]).length,faltas:(s.match(/F/g)||[]).length};}
const decFalta=(id,loc,mk)=>{const k=id+':'+loc+':'+mk;return k in S.falta?S.falta[k]:DEC_FALTA[k]};
const pagosMes=(id,loc,mk)=>PAGOS_EMP.filter(p=>p.emp===id&&p.local===loc&&p.f.slice(5,7)===MESES[mk].k);
function empCalc(e,mk,loc=S.local){
  const a=ASG(e,loc);if(!a)return null;
  const m=MESES[mk],pg=pagosMes(e.id,loc,mk),suma=t=>pg.filter(p=>t.includes(p.tipo)).reduce((x,p)=>x+p.monto,0);
  const ex=suma(['Extra']),lleva=suma(['Sueldo','Adelanto','Extra']),as=asisMes(e,mk,loc);
  const mens=mk==='ago'?(AGO_SNAP[e.id+':'+loc]??a.mens):a.mens;
  const per=mk==='ago'?(a.alta>m.fin?[]:[{ini:m.ini,fin:m.fin,met:'mes',amt:mens}]):periodos(a,mk);
  let base=per.reduce((x,p)=>x+p.amt,0),fVal=0,fDec=null;
  if(as.faltas){fVal=r100e(as.faltas*mens/26);fDec=decFalta(e.id,loc,mk);if(fDec===true)base-=fVal}
  const arr=mk==='sep'?-(empCalc(e,'ago',loc)?.dif||0):0;
  const total=base+ex+arr;
  const desc=fDec===true?fVal:0;
  /* a hoy: lo que ya venció contra lo que se llevó */
  const venc=per.filter(p=>p.fin<=HOYISO).reduce((x,p)=>x+p.amt,0)-desc+ex+arr;
  const vencAntes=per.filter(p=>p.fin<HOYISO).reduce((x,p)=>x+p.amt,0)-desc+ex+arr;
  const cub=lleva-vencAntes, atras=Math.max(0,-cub), sobra=Math.max(0,cub);
  const prox=per.find(p=>p.fin>=HOYISO), aPagar=prox?Math.max(0,prox.amt-sobra):0;
  return {pg,ex,lleva,as,base,fVal,fDec,arr,total,dif:lleva-total,mens,per,venc,debe:venc-lleva,atras,sobra,prox,aPagar,loc};
}
function empTot(e,mk){const cs=locsDe(e).map(l=>empCalc(e,mk,l)).filter(Boolean),T=k=>cs.reduce((a,c)=>a+c[k],0);
  return {cs,total:T('total'),lleva:T('lleva'),dif:T('dif'),arr:T('arr'),venc:T('venc'),debe:T('debe'),atras:T('atras'),fPend:cs.some(c=>c.fVal&&c.fDec==null)};}
function empPill(c,mk){
  if(c.fVal&&c.fDec==null||c.fPend)return `<span class="pill warn">Falta a decidir</span>`;
  if(MESES[mk].cerrado){if(Math.abs(c.dif)<1)return `<span class="pill ok">${ico('check')}Al día</span>`;
    return c.dif>0?`<span class="pill warn">Cobró de más</span>`:`<span class="pill crit">Le faltó cobrar</span>`;}
  if(c.atras>=1)return `<span class="pill crit">Atrasado ${money(c.atras)}</span>`;
  if(c.debe>=1)return `<span class="pill warn">Cobra hoy ${money(c.debe)}</span>`;
  if(c.debe<=-1)return `<span class="pill info">Adelantado ${money(-c.debe)}</span>`;
  return `<span class="pill ok">${ico('check')}Al día</span>`;
}

        <td class="r n s">${money(montoPer(p.base,'dia'))}</td><td class="r n s">${money(montoPer(p.base,'semana'))}</td><td class="r n s">${money(montoPer(p.base,'quincena'))}</td>
        <td>${es.length?es.map(([e,x,a])=>`<button class="pill ${a.propio!=null?'warn':'mute'}" style="border:0;cursor:pointer;margin:2px 4px 2px 0" data-emp="${e.id}" data-eloc="${x}">${esc(e.n)}${ad&&x!==S.local?' · '+esc(LCN(x)):''} · ${MET[a.met].n.toLowerCase()}${a.propio!=null?' · '+money(a.propio):''}</button>`).join(''):'<span class="s">Sin empleados</span>'}</td></tr>`}).join(''),820)}
    ${ad?`<button class="btn gh mt" data-toast="Nuevo puesto: nombre y sueldo base mensual">${ico('plus')}Nuevo puesto</button>`:''}
    <div class="note mt">Los puestos no son los roles del sistema: <b>administrador, encargado y cajero</b> definen qué ve cada uno en la app. El puesto define cuánto cobra.</div>`;
  }
  return tabsBar('emp',l)+b;
}
function agCalc(e,loc=S.local){const a=ASG(e,loc),mejor=a.mens;
  const ini=new Date(Math.max(new Date(a.alta+'T12:00'),new Date('2026-07-01T12:00'))),fin=new Date('2026-12-31T12:00');
  const prop=Math.max(0,Math.min(1,(fin-ini)/(fin-new Date('2026-07-01T12:00'))));
  return {mejor,prop,calc:Math.round(mejor*.5*prop/100)*100};}
function vacCalc(e,loc=S.local){const a=ASG(e,loc),ing=e.datos.ing||a.alta;
  const anos=(new Date('2026-12-31T12:00')-new Date(ing+'T12:00'))/(365.25*864e5), vd=r100e(a.mens/25);
  let dias,ant;
  if(anos<.5){dias=Math.floor(diasEntre(a.alta,HOYISO)*26/30/20);ant='menos de 6 meses · 1 día cada 20 trabajados'}
  else{dias=anos<5?14:anos<10?21:anos<20?28:35;ant=anos<1?'menos de 1 año':Math.floor(anos)+' año'+(Math.floor(anos)>1?'s':'')}
  return {dias,vd,ant:(e.datos.ing?'':'sin fecha de ingreso · ')+ant,calc:Math.round(dias*vd/100)*100};}

   PROV.filter(p=>p.activo).slice().sort((a,b)=>b.saldo-a.saldo).map(p=>`<tr><td class="m">${esc(p.n)}</td><td class="s">${esc(p.rubro)}</td>

function movs(){
  const m=[];
  CARGAS.forEach(c=>m.push({k:'carga',f:c.f,det:c.id,pill:c.estado==='pendiente'?'warn':c.nro?'info':'mute',et:(c.nro?'Factura':'Carga sin comprobante')+(c.estado==='pendiente'?' · espera aprobación':''),
    n:PV(c.prov).n,d:(c.nro?'Comprobante '+c.nro:'Sin comprobante')+' · '+c.it.length+' productos · por '+c.via.toLowerCase(),v:money(totCarga(c)),by:c.by,fac:!!c.nro}));
  PRODS.filter(p=>p.f>='2026-09-08'&&p.estado!=='proceso').forEach(p=>{const c=runEtapas(p.rec,p.st,p.factor);m.push({k:'prod',f:dm(p.f),det:p.id,pill:p.estado==='pendiente'?'warn':p.estado==='eliminada'?'mute':'warn',et:p.estado==='pendiente'?'Producción · espera aprobación':p.estado==='eliminada'?'Producción eliminada':'Producción',
    n:R(p.rec).n,d:`${qtyTxt(p.rec,c.qty||0)} · ${c.st.map(x=>x.et.n).join(' → ')} · desperdicio ${pctS(c.st.reduce((a,x)=>a+x.despKg,0)/c.kgIn)}`,v:money(c.cost),by:p.by})});
  BAJAS.forEach(b=>m.push({k:'baja',f:dm(b.f),det:b.id,pill:b.estado==='pendiente'?'warn':'crit',et:'Baja por desperdicio'+(b.estado==='eliminada'?' · eliminada':b.estado==='pendiente'?' · espera aprobación':''),
    n:bajaN(b),d:`${q(b.qty,2)} ${bajaU(b)} · ${TN(b.tipo)} · ${b.motivo}`,v:money(bajaCost(b)),by:b.by}));
  SALIDAS.forEach(s=>m.push({k:'sal',f:s.f,det:s.id,pill:'mute',et:'Salida',n:s.dest,
    d:s.it.map(([t,id,c])=>t==='i'?`${q0(c)} ${P(id).u} ${P(id).n}`:`${qtyTxt(id,c)} ${R(id).n}`).join(' · '),v:money(totSal(s)),by:s.by}));
  CAJAS.filter(c=>c.estado!=='abierta').forEach(c=>{const C=cajaCalc(c);m.push({k:'caja',f:c.f,det:c.id,pill:'ok',et:'Caja',n:'Turno '+c.turno,
    d:C.sin?`${c.rends.length} rendiciones · contado ${money(c.conteo||0)} · falta cargar Maxirest`:`${c.rends.length} rendiciones · ${c.g.length} gasto${c.g.length>1?'s':''} · esperado ${money(C.tE)} · contado ${money(C.tR)}${c.sis===sumPOS(c)?'':' · total del sistema no coincide'}`,v:C.dif===0?'cierra':signo(C.dif),by:c.cajero,dif:C.dif})});
  const o={'12/09':5,'11/09':4,'10/09':3,'09/09':2,'08/09':1};
  return m.sort((a,b)=>(o[b.f]||0)-(o[a.f]||0));
}

function mdlDet(k,id){
  const hd=(t,s)=>`<div class="mhd"><div><h3 id="mTtl">${t}</h3><p>${s}</p></div><button data-close aria-label="Cerrar">✕</button></div>`;

  if(k==='carga'&&CARGAS.find(x=>x.id===id).caja)return mdlFcDet(id);
  if(k==='carga'){const c=CARGAS.find(x=>x.id===id),t=totCarga(c);
    return hd('Carga de stock',esc(PV(c.prov).n)+' · '+c.f+' · '+(c.nro?'comprobante '+c.nro:'sin comprobante'))+
    `<div class="grid g3" style="margin-bottom:14px">${stat('Total',money(t),c.it.length+' productos','dark')}
      ${stat('Cargada por',esc(c.by),'con '+c.via.toLowerCase())}${stat('Cuenta corriente','+'+money(t),'sumó al saldo del proveedor','warn')}</div>
    <div class="cd">${c.it.map(([pid,qq,pp])=>`<div class="ln"><span class="nm"><b>${esc(P(pid).n)}</b><i>${q(qq,1)} ${P(pid).u} × ${money2(pp)}</i></span>
      <span class="am">${money(qq*pp)}</span></div>`).join('')}
      <div class="ln" style="border-top:2px solid var(--bs)"><span class="nm"><b>Total de la carga</b></span><span class="am">${money(t)}</span></div></div>
    <div class="note mt">Esta carga <b>subió el stock</b> de cada producto y actualizó su precio vigente.</div>`+ft;}
  if(k==='prod')return mdlProd(id);
  if(k==='baja'){const b=BAJAS.find(x=>x.id===id);return hd('Baja por desperdicio',esc(bajaN(b))+' · '+dm(b.f)+' '+b.hora)+
    `<div class="cd"><div class="ln"><span class="nm"><b>${esc(TN(b.tipo))}</b><i>${esc(b.motivo)}</i></span><span class="am">${q(b.qty,2)} ${bajaU(b)}</span></div>
      <div class="ln"><span class="nm"><b>Pérdida</b></span><span class="am">${money(bajaCost(b))}</span></div>
      <div class="ln"><span class="nm"><b>Cargó</b><i>${b.aprob?'aprobó '+esc(b.aprob):'sin aprobar'}</i></span><span class="am">${esc(b.by)}</span></div></div>`+ft;}
  if(k==='sal'){const s=SALIDAS.find(x=>x.id===id);
    return hd('Salida',esc(s.dest)+' · '+s.f+' · turno '+esc(s.turno))+
    `<div class="cd">${s.it.map(([t,pid,cc])=>`<div class="ln"><span class="pill ${t==='i'?'mute':'info'}">${t==='i'?'Mercadería':'Elaborado'}</span>
      <span class="nm"><b>${esc(t==='i'?P(pid).n:R(pid).n)}</b><i>${t==='i'?q0(cc)+' '+P(pid).u:qtyTxt(pid,cc)}</i></span>
      <span class="am">${money(cc*(t==='i'?P(pid).precio:costoUn(pid)))}</span></div>`).join('')}
      <div class="ln" style="border-top:2px solid var(--bs)"><span class="nm"><b>Valor de la salida</b></span><span class="am">${money(totSal(s))}</span></div></div>
    <div class="note mt">Cargada por <b>${esc(s.by)}</b>. Bajó del stock en el momento de registrarla.</div>`+ft;}
  const c=CAJAS.find(x=>x.id===id),C=cajaCalc(c);
  return hd('Cierre de caja','Turno '+esc(c.turno)+' · '+c.f+' · '+esc(c.cajero))+
    `<div class="grid g3" style="margin-bottom:14px">${stat('Esperado',money(C.tE),'POS menos gastos en efectivo')}

    <div class="seclbl" style="margin-top:0">Gastos del turno</div>
    <div class="cd">${c.g.map(g=>`<div class="ln"><span class="pill ${g.medio==='Efectivo'?'warn':'mute'}">${esc(g.medio)}</span>
      <span class="nm"><b>${esc(g.cat)}</b><i>${esc(g.det)} · ${g.h} · ${esc(g.by)}</i></span><span class="am">${money(g.monto)}</span></div>`).join('')}

function cierreCalc(){
  const m=$('#mdl');if(!m.querySelector('#cDif'))return;
  const e={},r={};
  m.querySelectorAll('.cIn').forEach(i=>{(i.dataset.g==='esp'?e:r)[i.dataset.k]=+i.value||0});r.efectivo=CS().conteo||0;
  const g=CS().g.filter(x=>x.medio==='Efectivo').reduce((a,x)=>a+x.monto,0);
  const suma=Object.values(e).reduce((a,b)=>a+b,0), te=suma-g, tr=Object.values(r).reduce((a,b)=>a+b,0), d=tr-te;
  const box=m.querySelector('#cBox'), out=m.querySelector('#cDif');
  out.textContent=d===0?money(0):signo(d);
  const col=d===0?'var(--ok)':d<0?'var(--crit)':'var(--warn)';
  out.style.color=col;box.style.borderColor=col;box.style.background=d===0?'var(--ok-bg)':d<0?'var(--crit-bg)':'var(--warn-bg)';
  m.querySelector('#cSub').innerHTML=(d===0?'El turno cierra exacto. ':d<0?'Falta plata, en contra. ':'Sobra plata, a favor. ')+'Gastos en efectivo descontados: '+money(g);
  const sis=+m.querySelector('#e5').value||0, ds=sis-suma, chk=m.querySelector('#cChk');
  chk.innerHTML=ds===0?`<span class="pill ok">${ico('check')}Coincide</span> La suma por medio de pago da lo mismo que el sistema: ${money(suma)}.`
    :`<span class="pill crit">${ico('alert')}No coincide</span> La suma por medio de pago da ${money(suma)}: ${ds>0?'le faltan':'le sobran'} <b>${money(Math.abs(ds))}</b> contra el sistema. Revisá si falta un medio o hay un número mal tipeado.`;
}

function wire(root){
  /* pago a empleado */
  if(root.querySelector('#peEmp')){
    const up=()=>{const id=root.querySelector('#peEmp').value,tp=root.querySelector('#peTipo').value,h=root.querySelector('#peHint');
      root.querySelector('#peNuevo').innerHTML=id==='nuevo'?`<div class="row2"><div class="field"><label for="peNn">Nombre y apellido</label><input id="peNn" placeholder="ej: Ana López"><div class="hint" id="peNErr" style="color:var(--crit)"></div></div>
        <div class="field"><label for="peFv">Puesto</label><select id="peFv"><option value="" selected disabled>Elegí el puesto</option>${PUESTOS.map(p=>`<option value="${p.id}">${esc(p.n)} · ${money(p.base)} por mes</option>`).join('')}</select><div class="hint" id="peFErr" style="color:var(--crit)"></div></div></div>
        <div class="field"><label for="peMt">Método de pago</label><select id="peMt">${Object.entries(MET).map(([k,m])=>`<option value="${k}" ${k==='dia'?'selected':''}>${m.n}</option>`).join('')}</select></div>
        <div class="hint" style="margin:-4px 0 10px">Queda <b>a prueba</b> en este local y cobra la base del puesto. El administrador o el encargado lo confirman después como fijo, o le dan de baja.</div>`:'';
      if(id!=='nuevo'&&(tp==='Aguinaldo'||tp==='Vacaciones')){const e=EM(id),k=(tp==='Aguinaldo'?'ag:':'va:')+id+':'+S.local;
        root.querySelector('#peMonto').value=S.aj[k]??(tp==='Aguinaldo'?agCalc(e).calc:vacCalc(e).calc);}
      if(!h)return;
      if(id==='nuevo'){h.innerHTML='Alguien nuevo: todavía no tiene nada cargado.';return}
      const c=empCalc(EM(id),'sep'),a=ASG(EM(id));
      h.innerHTML=`<b>${esc(EM(id).n)} cobra ${MET[a.met].n.toLowerCase()}: ${money(a.mp)}.</b> `+
        (c.debe>0?`Tiene <b style="color:var(--crit)">${money(c.debe)} vencidos sin pagar</b>.`:c.debe<0?`Ya tiene ${money(-c.debe)} adelantado.`:'Está al día.')+
        (c.prox?` Próximo pago: ${fechaPago(c.prox).toLowerCase()}, ${money(c.aPagar)}.`:'');
      if(tp==='Sueldo'&&c.prox){root.querySelector('#peMonto').value=c.atras+c.aPagar;
        h.innerHTML+=` <br>Monto sugerido: ${c.atras?'lo atrasado más ':''}el pago del ${dm(c.prox.fin)}. Lo podés cambiar.`;}};
    root.querySelector('#peEmp').addEventListener('change',up);root.querySelector('#peTipo').addEventListener('change',up);up();
  }
  /* alta: el monto por período sale del sueldo del puesto dividido según el método */
  if(root.querySelector('#aPu')){
    const pu=root.querySelector('#aPu'),mt=root.querySelector('#aMet'),va=root.querySelector('#aVal'),h=root.querySelector('#aValH');
    let prevF=MET[mt.value].f;
    const upd=auto=>{const M=MET[mt.value];root.querySelector('#aValL').textContent='Monto '+M.u;root.querySelector('#aMetH').textContent='Se le paga '+M.cuando+'.';
      if(!pu.value)return;const b=PU(pu.value).base;if(auto===true)va.value=montoPer(b,mt.value);
      if(auto==='met'){va.value=r100e((+va.value||0)*prevF/M.f);}prevF=M.f;
      const mens=(+va.value||0)*M.f;h.innerHTML=`= ${money(mens)} por mes. `+(Math.abs(mens-b)<M.f*100?'Es la base del puesto.':`${pct1(Math.abs(mens/b-1)*100)} ${mens>b?'más':'menos'} que la base (${money(b)}).`);};
    pu.addEventListener('change',()=>{root.querySelector('#aPuErr').textContent='';upd(true)});
    mt.addEventListener('change',()=>upd(+va.value&&pu.value?'met':true));
    va.addEventListener('input',()=>upd(false));upd(false);
  }
  /* producción por etapas */
  if(root.querySelector('#pwCmp'))pwRefresh();
  if(root.querySelector('#rdRes'))rdRefresh();
  if(root.querySelector('#npR')){const up=()=>{const k=root.querySelector('#npR').value,f=+root.querySelector('#npF').value||1,e=prEst(k,f);
      root.querySelector('#npH').innerHTML=`1 lote = ${esc(PRS[k].lote)}. Con ${q(f,1)} se estima que salen <b>${qtyTxt(k,e.qty)}</b>.`};
    root.querySelector('#npR').addEventListener('change',up);root.querySelector('#npF').addEventListener('input',up);up();}
  if(root.querySelector('#cDif'))cierreCalc();
  const gc=root.querySelector('#gCat');
  if(gc){const up=()=>{const b=root.querySelector('#gEx');
      if(gc.value==='Proveedor')b.innerHTML=`<div class="field"><label for="gProv">Proveedor</label><select id="gProv">${PROV.filter(p=>p.activo).map(p=>`<option>${esc(p.n)}</option>`).join('')}</select><div class="hint">Los proveedores salen de las cargas de factura: acá solo se eligen.</div></div>`;
      else b.innerHTML='';};
    gc.addEventListener('change',up);up();}
}

function render(keep){
  if(!can(S.scr))S.scr=S.rol==='cajero'?'caja':ALL().find(i=>i.rol.includes(S.rol)).id;
  const cur=ALL().find(i=>i.id===S.scr);
  const menu=NAV.map(g=>{const it=g.items.filter(i=>i.rol.includes(S.rol));
    return it.length?`<div class="snav-grp">${g.g}</div>`+it.map(i=>`<button class="snav-btn ${i.id===S.scr?'active':''}" data-go="${i.id}" ${i.id===S.scr?'aria-current="page"':''}>${ico(i.ic)} ${i.n}${i.id==='usuarios'?`<span class="snav-badge">${SOLICITUDES.length}</span>`:''}</button>`).join(''):''}).join('');
  $('#snav').innerHTML=menu;$('#drwNav').innerHTML=menu;
  $('#drwRol').textContent=QUIEN[S.rol];$('#drwLoc').textContent=LC(S.local).n;
  const bn=BNAV[S.rol].map(id=>ALL().find(i=>i.id===id)).filter(i=>i&&i.rol.includes(S.rol));
  $('#bnav').innerHTML=bn.map(i=>`<button class="${i.id===S.scr?'active':''}" data-go="${i.id}">${ico(i.ic)}<span>${i.n}</span></button>`).join('')
    +`<button class="${bn.some(i=>i.id===S.scr)?'':'active'}" data-more aria-haspopup="dialog" aria-controls="drw">${ico('dots')}<span>Más</span></button>`;
  $('#sideRol').textContent=QUIEN[S.rol];
  $('#hTtl').textContent=cur.n;
  $('#hSub').textContent=LC(S.local).n+' · '+SUB[S.scr];
  $('#hAct').innerHTML=S.scr==='produccion'&&!S.prodAct?`<button class="btn gh" data-mdl="bajadesp">Baja por desperdicio</button> <button class="btn ok" data-newprod>${ico('plus')}Nueva producción</button>`
    :S.scr==='stock'?`<button class="btn gh" data-mdl="bajadesp">Baja por desperdicio</button> <button class="btn" data-mdl="carga">${ico('plus')}Nueva carga</button>`
    :['estado','productos','historial'].includes(S.scr)&&S.rol!=='cajero'?`<button class="btn" data-mdl="carga">${ico('plus')}Nueva carga</button>`
    :S.scr==='clientes'?`<button class="btn" data-clinew>${ico('plus')}Nuevo cliente</button>`
    :S.scr==='costeo'?`<button class="btn gh" data-mdl="export">${ico('dl')}Exportar recetario</button>`
    :S.scr==='empleados'?`<button class="btn gh" data-alta>${ico('plus')}Dar de alta</button> <button class="btn" data-mdl="pagoemp">Registrar pago</button>`
    :S.scr==='caja'&&S.rol!=='cajero'?`<button class="btn gh" data-mdl="pagoemp">Pago a empleado</button> <button class="btn" data-mdl="gasto">${ico('plus')}Nuevo gasto</button>`:'';
  $('#fab').style.display=window.innerWidth<=900&&S.rol!=='cajero'&&!['empleados','caja','produccion','desperdicio'].includes(S.scr)?'grid':'none';
  $('#bd').innerHTML='<div>'+SCR[S.scr]()+'</div>';
  wire($('#bd'));if(!keep)window.scrollTo({top:0});
}

document.addEventListener('click',e=>{
  if(e.target.id==='drw'){closeDrw();return}
  const t=e.target.closest('[data-go],[data-rol],[data-tab],[data-rec],[data-mdl],[data-step],[data-hist],[data-det],[data-toast],[data-close],[data-save],[data-per],[data-mes],[data-ptipo],[data-emp],[data-falta],[data-as],[data-orig],[data-more],[data-drwclose]');
  if(!t)return;
  if(t.dataset.go){closeMdl();closeDrw();S.scr=t.dataset.go;render();return}
  if(t.hasAttribute('data-more')){openDrw();return}
  if(t.hasAttribute('data-drwclose')){closeDrw();return}
  if(t.dataset.per){S.per={k:t.dataset.per,d1:PER[t.dataset.per][0],d2:PER[t.dataset.per][1]};render(true);return}
  if(t.dataset.mes){S.mes=t.dataset.mes;render(true);return}
  if(t.dataset.ptipo){S.f.ptipo=t.dataset.ptipo;render(true);return}
  if(t.dataset.falta){const[id,loc,mk,v]=t.dataset.falta.split(':');S.falta[id+':'+loc+':'+mk]=v==='1';render(true);openMdl(mdlEmp(id));
    toast(v==='1'?'La falta se descuenta del sueldo.':'La falta queda registrada, sin descuento.');return}
  if(t.dataset.as){const[id,i]=t.dataset.as.split(':'),a=[...S.asis[id][S.local]],nx={o:'F',F:'-','-':'o'};a[+i]=nx[a[+i]]||'o';S.asis[id][S.local]=a.join('');render(true);return}
  if(t.dataset.orig){t.parentElement.querySelectorAll('[data-orig]').forEach(b=>b.setAttribute('aria-pressed',b===t));return}
  if(t.dataset.emp&&!t.dataset.mdl){openFicha(t.dataset.emp,t.dataset.eloc);return}
  if(t.dataset.rol){closeMdl();closeDrw();S.rol=t.dataset.rol;S.tab={};renderRoles();render();return}
  if(t.dataset.tab){const[a,b]=t.dataset.tab.split(':');S.tab[a]=b;render();return}
  if(t.dataset.hist){S.f.hist=t.dataset.hist;render();return}
  if(t.dataset.step){const[m,s]=t.dataset.step.split(':');openMdl(MDL[m](+s));return}
  if(t.hasAttribute('data-close')){closeMdl();return}
  if(t.hasAttribute('data-save')){closeMdl();toast('Receta actualizada. Se recalculó todo lo que la usa.');render();return}
  if(t.dataset.toast){toast(t.dataset.toast);if(t.closest('#drw'))closeDrw();if(t.closest('#mdl')){closeMdl();render()}return}
  if(t.dataset.det){const[k,id]=t.dataset.det.split(':');openMdl(mdlDet(k,id));return}
  if(t.dataset.rec){openMdl(mdlRec(t.dataset.rec),t.dataset.rec);return}
  if(t.dataset.mdl){openMdl(MDL[t.dataset.mdl](t.dataset.pe||1));return}
});

  if(t.dataset.savedatos){const e=EM(t.dataset.savedatos);m.querySelectorAll('.dIn').forEach(i=>e.datos[i.dataset.k]=i.value.trim());

  if(t.dataset.confirm){const e=EM(t.dataset.confirm);e.asig[S.fichaLoc].estado='fijo';render(true);openMdl(mdlEmp(e.id));
    toast(`${e.n} quedó como fijo en ${LCN(S.fichaLoc)}.`);return}
  if(t.dataset.baja){openMdl(mdlBaja(t.dataset.baja));return}
  if(t.dataset.dobaja){const e=EM(t.dataset.dobaja),a=e.asig[S.fichaLoc];a.estado='baja';a.bajaF=val('#bF')||'2026-09-12';
    closeMdl();render(true);toast(`${e.n} quedó de baja en ${LCN(S.fichaLoc)}. Su historial sigue disponible.`);return}
  if(t.hasAttribute('data-dopago')){
    let id=val('#peEmp');
    if(id==='nuevo'){const n=(val('#peNn')||'').trim();
      if(!n){m.querySelector('#peNErr').textContent='Poné el nombre.';m.querySelector('#peNn').focus();return}
      if(!val('#peFv')){m.querySelector('#peFErr').textContent='Elegí el puesto.';m.querySelector('#peFv').focus();return}
      id='e'+Date.now();EMP.push({id,n,datos:{tel:'',ing:'',dni:'',cbu:''},asig:{[S.local]:{pid:val('#peFv'),met:val('#peMt')||'dia',estado:'prueba',alta:'2026-09-12'}}});
      S.asis[id]={[S.local]:'-----------o'};}

/* ---------- producción, bajas y aprobaciones ---------- */
const hhmm=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const stockMov=(add,sg)=>Object.entries(add||{}).forEach(([p,c])=>{P(p).stock=Math.round((P(p).stock-sg*c)*1000)/1000});
const prodObj=p=>`Producción · ${R(p.rec).n} (${p.by}, ${dm(p.f)})`;
const bajaObj=b=>`Baja por desperdicio · ${bajaN(b)} ${q(b.qty,2)} ${bajaU(b)} (${b.by}, ${dm(b.f)})`;
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-newprod],[data-prodstart],[data-prodopen],[data-pwexit],[data-pwaddrow],[data-pwrev],[data-pwok],[data-prodver],[data-aprob],[data-rech],[data-proddel],[data-prodedit],[data-prodsave],[data-bdrev],[data-bdback],[data-bdok],[data-bajaedit],[data-bajasave],[data-bajadel],[data-propok],[data-addtipo]');
  if(!t)return;
  const m=$('#mdl'),d=t.dataset;
  if(t.hasAttribute('data-newprod')){openMdl(mdlNewProd());return}
  if(t.hasAttribute('data-prodstart')){const rec=m.querySelector('#npR').value,f=+m.querySelector('#npF').value||1,id='np'+Date.now();
    PRODS.push({id,rec,factor:f,f:HOYISO,hora:hhmm(),by:yo(),estado:'proceso',st:[]});
    S.prodAct=id;S.pw=null;S.scr='produccion';closeMdl();render();toast(`${R(rec).n}: arrancá con ${PRS[rec].etapas[0].n.toLowerCase()}.`);return}
  if(d.prodopen){closeMdl();S.prodAct=d.prodopen;S.pw=null;S.scr='produccion';render();return}
  if(t.hasAttribute('data-pwexit')){const p=PRODS.find(x=>x.id===S.prodAct);S.prodAct=null;S.pw=null;
    if(p&&!p.st.length){PRODS.splice(PRODS.indexOf(p),1);render();toast('No se cargó ninguna etapa: la producción no se guardó.');return}
    render();toast('Queda en proceso. La puede seguir cualquiera desde Estado o Producción.');return}
  if(t.hasAttribute('data-pwaddrow')){S.pw.rows.push({kg:0,tipo:'desc'});render(true);return}
  if(t.hasAttribute('data-pwrev')){openMdl(mdlPwRev());return}
  if(t.hasAttribute('data-pwok')){const p=PRODS.find(x=>x.id===S.prodAct),spec=PRS[p.rec],pw=S.pw,i=p.st.length,ult=i===spec.etapas.length-1;
    const add={};Object.entries(pw.add).forEach(([k,v])=>{if(+v>0)add[k]=+v});
    p.st.push({add,desp:pw.rows.filter(r=>+r.kg>0).map(r=>({p:r.p,kg:+r.kg,tipo:r.tipo})),sale:+pw.sale||0,units:ult&&spec.salida==='u'?(+pw.units||0):undefined,by:yo(),hora:hhmm()});
    stockMov(add,1);S.pw=null;closeMdl();
    if(ult){const caj=S.rol==='cajero';p.estado=caj?'pendiente':'cerrada';if(!caj)p.aprob=yo();S.prodAct=null;render();
      const al=alertas(p);openMdl(mdlProd(p.id));
      toast((caj?'Producción cerrada: espera aprobación. ':'Producción cerrada. ')+(al.length?al.length+' aviso(s) de desperdicio.':'Dentro del margen.'));}
    else{render();toast(`Etapa guardada. Sigue: ${spec.etapas[i+1].n}.`);}
    return}
  if(d.prodver){openMdl(mdlProd(d.prodver));return}
  if(d.aprob||d.rech){const[k,id]=(d.aprob||d.rech).split(':'),ok=!!d.aprob;
    if(k==='prod'){const p=PRODS.find(x=>x.id===id);
      if(ok){p.estado='cerrada';p.aprob=yo();audit('Aprobó',prodObj(p));toast('Producción aprobada.');}
      else{p.st.forEach(s=>stockMov(s.add,-1));PRODS.splice(PRODS.indexOf(p),1);audit('Rechazó',prodObj(p),qtyTxt(p.rec,recQty(p))+' cargadas','Borrada: la mercadería vuelve al stock');toast('Producción rechazada: se borró y el stock volvió atrás.');}}
    else{const b=BAJAS.find(x=>x.id===id);
      if(ok){b.estado='aprobada';b.aprob=yo();audit('Aprobó',bajaObj(b));toast('Baja aprobada.');}
      else{b.estado='rechazada';b.aprob=yo();if(b.t==='i')P(b.id2).stock+=b.qty;audit('Rechazó',bajaObj(b),'','Vuelve al stock');toast('Baja rechazada: vuelve al stock.');}}
    closeMdl();render(true);return}
  if(d.proddel){const p=PRODS.find(x=>x.id===d.proddel);p.estado='eliminada';p.st.forEach(s=>stockMov(s.add,-1));
    audit('Eliminó',prodObj(p),qtyTxt(p.rec,recQty({...p,estado:'cerrada'})),'Eliminada');S.editProd=null;closeMdl();render(true);toast('Producción eliminada. Queda tachada y en el registro de cambios.');return}
  if(d.prodedit){S.editProd=d.prodedit;openMdl(mdlProd(d.prodedit));return}
  if(d.prodsave){const p=PRODS.find(x=>x.id===d.prodsave),antes=runEtapas(p.rec,p.st,p.factor);
    m.querySelectorAll('.peD').forEach(n=>{const s=p.st[+n.dataset.i],r=(s.desp||[]).filter(x=>x.kg>0)[+n.dataset.k];if(r)r.kg=+n.value||0});
    m.querySelectorAll('.peS').forEach(n=>{p.st[+n.dataset.i].sale=+n.value||0});
    const desp=runEtapas(p.rec,p.st,p.factor);
    audit('Modificó',prodObj(p),`salió ${qtyTxt(p.rec,antes.qty||0)} · desperdicio ${kg3(antes.st.reduce((a,s)=>a+s.despKg,0))}`,`salió ${qtyTxt(p.rec,desp.qty||0)} · desperdicio ${kg3(desp.st.reduce((a,s)=>a+s.despKg,0))}`);
    S.editProd=null;openMdl(mdlProd(p.id));render(true);toast('Corrección guardada en el registro de cambios.');return}
  if(t.hasAttribute('data-bdrev')){const [tp,id2]=m.querySelector('#bdP').value.split(':'),qty=+m.querySelector('#bdQ').value||0;
    if(!qty){toast('Poné la cantidad.');return}
    S.bd={rev:true,data:{t:tp,id2,qty,tipo:m.querySelector('#bdT').value,motivo:m.querySelector('#bdM').value.trim()}};openMdl(MDL.bajadesp('keep'));return}
  if(t.hasAttribute('data-bdback')){S.bd.rev=false;openMdl(MDL.bajadesp('keep'));
    const b=S.bd.data;m.querySelector('#bdP').value=b.t+':'+b.id2;m.querySelector('#bdQ').value=b.qty;m.querySelector('#bdT').value=b.tipo;m.querySelector('#bdM').value=b.motivo;return}
  if(t.hasAttribute('data-bdok')){const caj=S.rol==='cajero',b={id:'bj'+Date.now(),f:HOYISO,hora:hhmm(),...S.bd.data,motivo:S.bd.data.motivo||'sin motivo',by:yo(),estado:caj?'pendiente':'aprobada',aprob:caj?undefined:yo()};
    BAJAS.push(b);if(b.t==='i')P(b.id2).stock-=b.qty;S.bd={rev:false};closeMdl();render(true);
    toast(caj?'Baja cargada: salió del stock y espera aprobación.':'Baja cargada: salió del stock.');return}
  if(d.bajaedit){openMdl(mdlBajaEdit(d.bajaedit));return}
  if(d.bajasave){const b=BAJAS.find(x=>x.id===d.bajasave),v=+m.querySelector('#beQ').value||0,antes=q(b.qty,2)+' '+bajaU(b);
    if(b.t==='i')P(b.id2).stock+=b.qty-v;b.qty=v;audit('Modificó',bajaObj(b),antes,q(v,2)+' '+bajaU(b));closeMdl();render(true);toast('Baja modificada.');return}
  if(d.bajadel){const b=BAJAS.find(x=>x.id===d.bajadel);b.estado='eliminada';if(b.t==='i')P(b.id2).stock+=b.qty;
    audit('Eliminó',bajaObj(b),q(b.qty,2)+' '+bajaU(b),'Eliminada: vuelve al stock');render(true);toast('Baja eliminada. Queda tachada.');return}
  if(d.propok){const id=d.propok,spec=PRS[id],pr=propuesta(id);
    pr.forEach(x=>{const et=spec.etapas[x.i];if(x.k==='item')et.desp.items[x.p]=Math.round(x.a*1000)/1000;else if(x.k==='pct')et.desp.pct=Math.round(x.a*1000)/1000;else et.red=Math.round(x.a*1000)/1000});
    audit('Aprobó promedio',`Receta · ${R(id).n}`,pr.map(x=>`${x.txt} ${pctS(x.de)}`).join(' · '),pr.map(x=>pctS(x.a)).join(' · '));
    openMdl(mdlRec(id),id);render(true);toast(`${R(id).n}: la receta toma el promedio real. Se recalculó todo lo que la usa.`);return}
  if(t.hasAttribute('data-addtipo')){const n=($('#ntN').value||'').trim();if(!n){$('#ntN').focus();return}
    S.tiposExtra.push({id:'t'+Date.now(),n});render(true);toast(`Tipo agregado: ${n}.`);return}
});
document.addEventListener('input',ev=>{const t=ev.target,c=t.classList;if(!S.pw)return;
  if(c.contains('pwA'))S.pw.add[t.dataset.p]=+t.value||0;
  else if(c.contains('pwD'))S.pw.rows[+t.dataset.k].kg=+t.value||0;
  else if(c.contains('pwS'))S.pw.sale=+t.value||0;
  else if(c.contains('pwU'))S.pw.units=+t.value||0;
  else return;
  pwRefresh();});
document.addEventListener('change',ev=>{const t=ev.target,c=t.classList;
  if(c.contains('pwT')&&S.pw){S.pw.rows[+t.dataset.k].tipo=t.value;pwRefresh();}
  else if(c.contains('prEd')){const r=t.dataset.r,et=PRS[r].etapas[+t.dataset.i],v=(parseFloat(t.value)||0)/100,k=t.dataset.k;
    const antes=k==='item'?et.desp.items[t.dataset.p]:k==='pct'?et.desp.pct:et.red;
    if(k==='item')et.desp.items[t.dataset.p]=v;else if(k==='pct')et.desp.pct=v;else et.red=v;
    audit('Modificó',`Receta · ${R(r).n} · ${et.n}`,pctS(antes),pctS(v));
    openMdl(mdlRec(r),r);render(true);toast('Estimado actualizado. Se recalculó el costo.');}
  else if(c.contains('prMg')){const r=t.dataset.r;PRS[r].margen=+t.value||0;toast(`Margen de aviso: ${PRS[r].margen} puntos.`);render(true);}
});

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-abrirturno],[data-cajasel],[data-rdnew],[data-rdver],[data-rdadd],[data-rddel],[data-rdrev],[data-rdback],[data-rdok],[data-rdreab],[data-rddesc],[data-cjcerrar],[data-cjrev],[data-cjback],[data-cjok],[data-cjreab],[data-cjreabok],[data-cjsave],[data-cjctrl],[data-gsave],[data-clinew],[data-clisave],[data-cliver],[data-clicobro]');

  if(t.hasAttribute('data-abrirturno')){const id=$('#atC').value;if(!id){$('#atErr').textContent='Elegí quién está en la caja.';$('#atC').focus();return}
    const tu=$('#atT').value;CAJAS.unshift({id:'cj'+Date.now(),f:'12/09',turno:tu,cajera:id,cajero:EM(id).n,abre:hhmm(),estado:'abierta',conteo:null,sis:null,esp:null,real:null,g:[],rends:[]});

  if(d.rdver){const[c,r]=d.rdver.split(':');openMdl(mdlRendDet(c,r));return}
  if(d.rdadd){if(d.rdadd==='ret')S.rd.ret.push('');else S.rd.cc.push({cli:'',m:''});openMdl(mdlRend());return}
  if(d.rddel){const[k,i]=d.rddel.split(':');S.rd[k].splice(+i,1);if(k==='ret'&&!S.rd.ret.length)S.rd.ret.push('');openMdl(mdlRend());return}
  if(t.hasAttribute('data-rdrev')){const rd=S.rd;if(!rd.emp){toast('Elegí quién rinde.');m.querySelector('#rdE').focus();return}
    if(rd.mx.total===''||rd.ef===''){toast('Cargá el total del papel de Maxirest y el efectivo que entrega.');return}
    if(rd.cc.some(x=>N(x.m)>0&&!x.cli)){toast('Elegí el cliente de la cuenta corriente.');return}
    rd.rev=true;openMdl(mdlRend());return}
  if(t.hasAttribute('data-rdback')){S.rd.rev=false;openMdl(mdlRend());return}
  if(t.hasAttribute('data-rdok')){const rd=S.rd,c=CAJAS.find(x=>x.id===rd.caja);
    const data={emp:rd.emp,mx:{total:N(rd.mx.total),ef:N(rd.mx.ef),mp:N(rd.mx.mp),cc:N(rd.mx.cc)},ef:N(rd.ef),mp:N(rd.mp),ret:rd.ret.map(N).filter(x=>x>0),cc:rd.cc.filter(x=>x.cli&&N(x.m)>0).map(x=>({cli:x.cli,m:N(x.m)}))};
    const k=rdCalc(data),res=x=>x.net===0?'justo':signo(x.net);S.rd=null;
    if(rd.edit){const r=c.rends.find(x=>x.id===rd.edit),ka=rdCalc(r);
      audit('Modificó',`Rendición · ${EM(r.emp).n} (${cjNom(c)})`,`entregó ${money(r.ef)} · retiros ${money(ka.ret)} · ${res(ka)}`,`entregó ${money(data.ef)} · retiros ${money(k.ret)} · ${res(k)}`);
      Object.assign(r,data,{reab:yo()});r.desc=k.net<0?(r.desc??null):undefined;render(true);openMdl(mdlRendDet(c.id,r.id));toast('Rendición corregida. Quedó en el registro de cambios.');return}
    c.rends.push(Object.assign({id:'rd'+Date.now(),hora:hhmm(),by:yo()},data,k.net<0?{desc:null}:{}));
    closeMdl();render(true);
    toast(`Rendición de ${EM(data.emp).n} confirmada: ${k.net===0?'le dan todos los números':k.net<0?'falta '+money(-k.net):'sobra '+money(k.net)}.`);return}
  if(d.rdreab){const[cid,rid]=d.rdreab.split(':'),c=CAJAS.find(x=>x.id===cid),r=c.rends.find(x=>x.id===rid);
    audit('Reabrió',`Rendición · ${EM(r.emp).n} (${cjNom(c)})`,'confirmada','reabierta para corregir');
    S.rd={caja:cid,emp:r.emp,mx:{...r.mx},ef:r.ef,mp:r.mp,ret:r.ret.length?[...r.ret]:[''],cc:r.cc.map(x=>({...x})),rev:false,edit:rid};openMdl(mdlRend());return}
  if(d.rddesc){const[cid,rid,x]=d.rddesc.split(':'),c=CAJAS.find(y=>y.id===cid),r=c.rends.find(y=>y.id===rid),k=rdCalc(r),e=EM(r.emp);
    r.desc=x==='1';
    if(r.desc)PAGOS_EMP.push({f:HOYISO,emp:r.emp,tipo:'Descuento',monto:-k.net,origen:'desc',local:S.local,by:yo(),nota:`Faltante de la rendición del ${c.f} (${c.turno.toLowerCase()})`});
    audit(r.desc?'Descontó':'No descontó',`Faltante · ${e.n} (${cjNom(c)})`,money(-k.net),r.desc?'descontado del sueldo':'sin descuento');
    render(true);openMdl(mdlRendDet(cid,rid));toast(r.desc?`Se descuentan ${money(-k.net)} del sueldo de ${e.n} en ${LCN(S.local)}.`:'Queda registrado, sin descuento.');return}
  if(t.hasAttribute('data-cjcerrar')){S.cjc={rev:false,conteo:'',noFalta:false};openMdl(mdlCerrarCaja());return}
  if(t.hasAttribute('data-cjrev')){S.cjc.noFalta=m.querySelector('#cjNF').checked;S.cjc.conteo=N(v('#cjE'));
    if(!S.cjc.noFalta){toast('Confirmá que no falta rendir nadie.');return}
    if(!S.cjc.conteo){toast('Cargá el efectivo que contaste.');m.querySelector('#cjE').focus();return}
    S.cjc.rev=true;openMdl(mdlCerrarCaja());return}
  if(t.hasAttribute('data-cjback')){S.cjc.rev=false;openMdl(mdlCerrarCaja());return}
  if(t.hasAttribute('data-cjok')){const c=CA();c.conteo=S.cjc.conteo;c.estado='cerrada';c.cierra=hhmm();if(c.real)c.real.efectivo=c.conteo;
    S.cajaSel=c.id;S.cjc=null;closeMdl();render();toast(`Caja cerrada por ${c.cajero} y bloqueada. La controla el encargado.`);return}
  if(d.cjreab){openMdl(mdlReab(d.cjreab));return}
  if(d.cjreabok){const c=CAJAS.find(x=>x.id===d.cjreabok),n=N(v('#rbE')),mot=(v('#rbM')||'').trim();
    if(n!==c.conteo)audit('Reabrió',`Cierre de caja · ${cjNom(c)} (${c.cajero})`,money(c.conteo),money(n)+(mot?' · '+mot:''));
    c.conteo=n;if(c.real)c.real.efectivo=n;c.reab=yo();closeMdl();render(true);toast('Conteo corregido. Quedó en el registro de cambios.');return}
  if(d.cjsave){const c=CAJAS.find(x=>x.id===d.cjsave),e={},r={};m.querySelectorAll('.cIn').forEach(i=>{(i.dataset.g==='esp'?e:r)[i.dataset.k]=N(i.value)});
    const habia=!!c.esp;if(habia)audit('Modificó',`Cierre de Maxirest · ${cjNom(c)}`,'total '+money(c.sis),'total '+money(N(v('#e5'))));
    c.esp=e;c.real=Object.assign(r,{efectivo:c.conteo||0});c.sis=N(v('#e5'));
    closeMdl();render(true);toast('Cierre de Maxirest guardado.');return}
  if(d.cjctrl){const c=CAJAS.find(x=>x.id===d.cjctrl),dif=cajaCalc(c).dif;c.estado='controlada';c.ctrl=yo();
    audit('Aprobó',`Caja · ${cjNom(c)} (${c.cajero})`,'',dif?'controlada con '+signo(dif):'controlada, exacta');render(true);toast('Turno controlado.');return}
  if(t.hasAttribute('data-gsave')){const monto=N(v('#gMonto'));if(!monto){toast('Poné el monto.');return}
    const c=CA()||CS(),cat=v('#gCat'),prov=v('#gProv'),det=(v('#gDet')||'').trim();
    c.g.push({h:hhmm(),cat,det:prov?prov+(det?' — '+det:''):det||'—',medio:v('#gMedio'),monto,by:yo()});
    closeMdl();render(true);toast(`Gasto cargado en el ${cjNom(c)}.`);return}
  if(t.hasAttribute('data-clinew')){openMdl(mdlCliNew());return}
  if(t.hasAttribute('data-clisave')){const n=(v('#clN')||'').trim();if(!n){m.querySelector('#clErr').textContent='Poné el nombre.';m.querySelector('#clN').focus();return}
    const id='cl'+Date.now();CLIENTES.push({id,n,tel:(v('#clT')||'').trim(),nota:(v('#clNo')||'').trim()});closeMdl();render(true);toast(`${n} quedó dado de alta. Ya aparece en las rendiciones.`);return}
  if(d.cliver){openMdl(mdlCli(d.cliver));return}
  if(d.clicobro){const mo=N(v('#cbM'));if(!mo){toast('Poné el monto del cobro.');return}
    CC_MOV.push({cli:d.clicobro,f:HOYISO,tipo:'cobro',m:mo,medio:v('#cbMed'),by:yo()});render(true);openMdl(mdlCli(d.clicobro));toast(`Cobro de ${money(mo)} registrado.`);return}

const ZONAS={sc:[{id:'z1',n:'Hasta 10 cuadras',p:1500},{id:'z2',n:'Hasta 20 cuadras',p:2500},{id:'z3',n:'Más de 20 cuadras',p:3800}],l2:[],l3:[],l4:[]};
const ZN=()=>ZONAS[S.local]||(ZONAS[S.local]=[]);
const CARTA=()=>REC.filter(r=>r.venta).sort((a,b)=>a.n.localeCompare(b.n));
function calcCompute(){const k=S.calc,ids=Object.keys(k.it).filter(id=>k.it[id]>0);
  const ln=ids.map(id=>{const r=R(id),q=k.it[id],base=r.venta*q,pc=k.modo==='prod'?(+k.dp[id]||0):0,d=base*pc/100;return {id,r,q,base,pc,d,fin:base-d}});
  const base=ln.reduce((a,x)=>a+x.base,0),desc=k.modo==='prod'?ln.reduce((a,x)=>a+x.d,0):base*(+k.dPed||0)/100;
  const z=ZN().find(z=>z.id===k.zona),env=z?z.p:0,sub=base-desc;
  return {ln,base,desc,sub,z,env,total:sub+env,pct:base?desc/base*100:0};}
function calcResHtml(c){
  if(!c.ln.length)return '<div class="empty">Tocá los productos de la carta para armar el pedido.</div>';
  return `<div class="ln"><span class="nm"><b>Precio sin descuento</b></span><span class="am">${money(c.base)}</span></div>
    <div class="ln"><span class="nm"><b>Descuento</b><i>${S.calc.modo==='prod'?'por producto':'al pedido, '+q(+S.calc.dPed||0,1)+'%'}</i></span><span class="am" style="color:var(--crit)">${c.desc?'− '+money(c.desc):'—'}</span></div>
    <div class="ln"><span class="nm"><b>Subtotal con descuento</b></span><span class="am">${money(c.sub)}</span></div>
    <div class="ln"><span class="nm"><b>Envío</b><i>${c.z?esc(c.z.n)+' · sin descuento':'retira en el local'}</i></span><span class="am">${c.env?money(c.env):'—'}</span></div>
    <div class="ln" style="border-top:2px solid var(--bs)"><span class="nm"><b style="font-size:15px">Total a cobrar</b></span><span class="am" style="font-size:24px">${money(c.total)}</span></div>
    ${c.desc>0?`<div class="cd mt" style="border-color:var(--ok);background:var(--ok-bg);padding:10px 12px"><b>El cliente se ahorra ${money(c.desc)}</b> <span class="s" style="color:var(--tp)">(${q(c.pct,1)}% de los productos)</span></div>`:''}`;}
function mdlCalc(){const k=S.calc,c=calcCompute(),zs=ZN();
  return `<div class="mhd"><div><h3 id="mTtl">Calculadora de descuentos</h3><p>Solo para consultar: no se guarda nada ni toca la caja</p></div><button data-close aria-label="Cerrar">✕</button></div>
  <div class="field"><label for="calcQ">Buscar en la carta</label><input id="calcQ" class="calcQ" placeholder="ej: milanesa, pizza, combo" autocomplete="off"></div>
  <div class="chips" id="calcCarta" style="margin:-4px 0 12px;max-height:132px;overflow:auto">${CARTA().map(r=>`<button class="fchip" data-cadd="${r.id}" data-nm="${esc(r.n.toLowerCase())}">+ ${esc(r.n)} · ${money(r.venta)}</button>`).join('')}</div>
  <div class="chips" style="margin:0 0 10px"><span class="s" style="align-self:center;margin-right:4px">Descuento:</span>
    <button class="fchip" aria-pressed="${k.modo==='prod'}" data-cmodo="prod">Por producto</button><button class="fchip" aria-pressed="${k.modo==='ped'}" data-cmodo="ped">Al pedido</button></div>
  ${k.modo==='ped'?`<div class="field"><label for="calcDP">Descuento a todo el pedido</label><div style="display:flex;gap:6px;align-items:center"><input id="calcDP" class="calcDped" type="number" min="0" max="100" step="1" value="${k.dPed}" placeholder="0" style="max-width:120px"><span class="s">%</span></div><div class="hint">Con descuento al pedido no se aplican los de cada producto.</div></div>`:''}
  <div class="seclbl" style="margin-top:4px">Pedido</div>
  <div class="cd">${c.ln.map(x=>`<div style="padding:9px 0;border-bottom:1px solid var(--bs)"><div style="display:flex;gap:8px;align-items:baseline"><b style="flex:1">${esc(x.r.n)}</b><span class="am" id="calcL-${x.id}">${money(k.modo==='prod'?x.fin:x.base)}</span></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px"><span class="s">${money(x.r.venta)} c/u</span>
      <span style="display:flex;align-items:center;gap:4px"><button class="btn gh sm" data-cq="${x.id}:-1" aria-label="Uno menos">−</button><b class="n" style="min-width:22px;text-align:center">${x.q}</b><button class="btn gh sm" data-cq="${x.id}:1" aria-label="Uno más">+</button></span>
      ${k.modo==='prod'?`<span style="display:flex;align-items:center;gap:4px;margin-left:auto"><span class="s">Descuento</span><input class="qty calcDp" data-id="${x.id}" type="number" min="0" max="100" step="1" value="${k.dp[x.id]??''}" placeholder="0" aria-label="Descuento de ${esc(x.r.n)}" style="width:62px"><span class="s">%</span></span>`:''}</div></div>`).join('')||'<div class="empty">Todavía no agregaste productos.</div>'}</div>
  <div class="field mt"><label for="calcZ">Envío</label><select id="calcZ" class="calcZona"><option value="">Retira en el local · sin envío</option>${zs.map(z=>`<option value="${z.id}" ${z.id===k.zona?'selected':''}>${esc(z.n)} · ${money(z.p)}</option>`).join('')}</select>
    <div class="hint">${zs.length?'El envío nunca lleva descuento.':'Este local todavía no tiene zonas de envío: las cargan el encargado o el administrador.'}</div></div>
  <div class="cd" id="calcRes">${calcResHtml(c)}</div>
  <div class="mft"><button class="btn gh" data-cclear>Limpiar</button><button class="btn" data-close>Listo</button></div>`;}
function calcRefresh(){const c=calcCompute(),b=$('#calcRes');if(!b)return;b.innerHTML=calcResHtml(c);

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-calc],[data-cadd],[data-cq],[data-cmodo],[data-cclear],[data-zdel],[data-zadd]');if(!t)return;const d=t.dataset,k=S.calc;
  if(t.hasAttribute('data-calc')){openMdl(mdlCalc());return}
  if(d.cadd){k.it[d.cadd]=(k.it[d.cadd]||0)+1;openMdl(mdlCalc());return}
  if(d.cq){const[id,n]=d.cq.split(':');k.it[id]=Math.max(0,(k.it[id]||0)+ +n);if(!k.it[id]){delete k.it[id];delete k.dp[id]}openMdl(mdlCalc());return}
  if(d.cmodo){k.modo=d.cmodo;openMdl(mdlCalc());return}
  if(t.hasAttribute('data-cclear')){S.calc={it:{},dp:{},modo:'prod',dPed:'',zona:''};openMdl(mdlCalc());return}
  if(d.zdel){const z=ZN().splice(+d.zdel,1)[0];render(true);toast(`Zona borrada: ${z.n}.`);return}
  if(t.hasAttribute('data-zadd')){const n=($('#znNew').value||'').trim(),p=+$('#znPr').value||0;if(!n){$('#znNew').focus();return}
    ZN().push({id:'z'+Date.now(),n,p});render(true);toast(`Zona agregada: ${n} · ${money(p)}.`);return}
});
